function toonLogin(melding, soort) {
  $('#app').innerHTML = loginHtml(melding, soort);
  const m = $('#loginMelding');
  // Vanuit de analyse-uitslag (?mail=) of de gastmodus: adres alvast invullen.
  try { const voor = new URLSearchParams(location.search).get('mail') || gastMail(); if (voor && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(voor)) { $('#loginMail').value = voor; if (!melding) { m.className = 'melding'; m.textContent = 'Je mailadres staat er al. Tik op Ga verder, dan krijg je een code.'; } } } catch (e) {}
  const naarCode = (email) => {
    $('#loginForm').style.display = 'none'; $('#codeForm').style.display = 'block';
    $('#loginNaar').textContent = email; $('#loginCode').value = ''; $('#loginCode').focus();
  };
  const vraagCode = async (knop) => {
    const email = $('#loginMail').value.trim(), oud = knop.textContent;
    knop.disabled = true; knop.textContent = 'Even versturen...'; m.className = 'melding'; m.textContent = '';
    try {
      const r = await fetch(API + '?actie=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const j = await r.json();
      if (j.ok) { naarCode(email); m.className = 'melding'; m.textContent = 'Niets binnen na een minuut? Kijk even in je spam.'; }
      else { m.className = 'melding fout'; m.textContent = j.fout || 'Dat lukte niet. Probeer het zo nog eens.'; }
    } catch { m.className = 'melding fout'; m.textContent = 'Verbinding mislukt. Probeer het zo nog eens.'; }
    knop.disabled = false; knop.textContent = oud;
  };
  $('#loginForm').addEventListener('submit', (e) => { e.preventDefault(); vraagCode($('#loginKnop')); });
  $('#opnieuw').addEventListener('click', () => vraagCode($('#opnieuw')));
  $('#anderAdres').addEventListener('click', () => { $('#codeForm').style.display = 'none'; $('#loginForm').style.display = 'block'; m.textContent = ''; $('#loginMail').focus(); });
  // Zes cijfers ingevuld (ook via autofill uit de mail) = meteen inloggen.
  $('#loginCode').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) $('#codeForm').requestSubmit(); });
  $('#codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = $('#codeKnop'); if (knop.disabled) return;
    knop.disabled = true; knop.textContent = 'Even kijken...';
    try {
      const r = await fetch(API + '?actie=verifieer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#loginMail').value.trim(), code: $('#loginCode').value }) });
      const j = await r.json();
      if (j.ok && j.t) { bewaarToken(j.t); return laadOverzicht(); }
      m.className = 'melding fout'; m.textContent = j.fout || 'Dat lukte niet.';
    } catch { m.className = 'melding fout'; m.textContent = 'Verbinding mislukt. Probeer het zo nog eens.'; }
    knop.disabled = false; knop.textContent = 'Log in';
  });
}

const ATM = 1.013;

// Andere maat voor dan achter (15-10-2026): de voorband krijgt zijn eigen berekening.
function voorEigen(a, f, gewicht) { if (!a || !f || !f.breedteVoor || f.breedteVoor === f.breedte) return a; const av = BT_LIB.bandenAdvies(BT_LIB.leesInvoer({ bandtype: f.type, gewicht, breedte: f.breedteVoor, tubeless: f.tubeless ? 'tubeless' : 'binnenband' })); return av ? { ...a, voor: av.voor } : a; }
const bandMaat = (f) => f && f.breedteVoor && f.breedteVoor !== f.breedte ? f.breedteVoor + '/' + f.breedte + ' mm' : (f ? f.breedte + ' mm' : '');
function sbReken(f) {

  const a = voorEigen(BT_LIB.bandenAdvies(BT_LIB.leesInvoer({ bandtype: f.type, gewicht: SB.profiel.gewicht, breedte: f.breedte, tubeless: f.tubeless ? 'tubeless' : 'binnenband' })), f, SB.profiel.gewicht);

// ---- Schema in de app (09-10-2026) ----
// Wat er vandaag op je schema staat, met Michels uitleg uit TrainingPeaks.
// De klant traint gewoon in TrainingPeaks; dit is de uitleg en de context.
const SK = { dag: null, open: {} };
function skUren(u) { if (!u) return ''; const m = Math.round(u * 60); return m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' uur' : m + ' min'; }
function skMin(sec) { if (!sec) return ''; if (sec < 60) return sec + ' sec'; if (sec % 60) return String(Math.round(sec / 6) / 10).replace('.', ',') + ' min'; const m = sec / 60; return m >= 60 ? Math.floor(m / 60) + ' u' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; }
function skVlak(blokken) {
  const uit = [];
  const loop = (b, keer) => { for (let i = 0; i < keer; i++) b.forEach((x) => x.stappen ? loop(x.stappen, x.x || 1) : uit.push(x)); };
  loop(blokken || [], 1);
  return uit.filter((x) => x.s);
}
function skGrafiek(blokken) {
  const stappen = skVlak(blokken); if (!stappen.length) return '';
  const tot = stappen.reduce((t, x) => t + x.s, 0); let xpos = 0;
  const rects = stappen.map((x) => { const pct = Math.min(130, x.hi || x.lo || 50); const h = Math.max(6, Math.round(pct / 130 * 46)); const w = x.s / tot * 300; const kleur = pct >= 100 ? '#FF6B1A' : pct >= 85 ? 'rgba(255,107,26,.75)' : pct >= 70 ? 'rgba(255,107,26,.45)' : 'rgba(245,243,239,.22)'; const r = `<rect x="${xpos.toFixed(2)}" y="${48 - h}" width="${Math.max(0.6, w - 0.6).toFixed(2)}" height="${h}" rx="1" fill="${kleur}"/>`; xpos += w; return r; }).join('');
  return `<svg class="sk-graf" viewBox="0 0 300 48" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`;
}
function skDoel(x, meet) {
  if (x.lo == null && x.hi == null) return '';
  const sa = D && D.schema && D.schema.analyse;
  const ftp = meet === 'vermogen' ? (sa && sa.meet === 'vermogen' ? sa.waarde : (D && D.analyse && D.analyse.meet !== 'hartslag' ? Number(String(D.analyse.ftp).replace(/[^0-9]/g, '')) : 0)) : 0;
  const pct = x.hi ? x.lo + '-' + x.hi + '%' : x.lo + '%';
  return ftp ? `${pct} (${Math.round(ftp * x.lo / 100)}${x.hi ? '-' + Math.round(ftp * x.hi / 100) : ''} W)` : pct;
}
function skBlokken(blokken, meet) {
  if (!blokken || !blokken.length) return '';
  const regel = (x) => x.stappen ? `<li>${x.x > 1 ? x.x + '&times; ' : ''}${x.stappen.map((y) => `${skMin(y.s)} <span>${esc(skDoel(y, meet))}</span>`).join(' &middot; ')}</li>` : `<li>${esc(x.n || 'Blok')}: ${skMin(x.s)} <span>${esc(skDoel(x, meet))}</span></li>`;
  return `<details class="sk-opbouw"><summary>Opbouw van de training</summary><ul class="sk-blokken">${blokken.map(regel).join('')}</ul></details>`;
}
// Core rond het schema (09-10-2026): op welke dagen van deze schemaweek je je
// core-sessies het beste doet. Rustdag het best, dan een rustige rit; nooit op
// een zware dag en liever niet de dag voor een zware training. Met rust ertussen.
const SK_RUSTIG = /duur|herstel|z2|cadans|voorbereiding|recovery/i;
function skZwaar(trainingen) { return trainingen.some((w) => !SK_RUSTIG.test(w.titel)); }
function coreDagen(s, aantal) {
  if (!s || s.status !== 'loopt' || !aantal) return [];
  const d = s.weekDagen;
  const score = d.map((x, i) => {
    let p = !x.trainingen.length ? 3 : skZwaar(x.trainingen) ? 0 : 2;
    if (d[i + 1] && skZwaar(d[i + 1].trainingen)) p -= 1.5;
    return { i, p };
  });
  const gekozen = [];
  for (const kandidaat of score.slice().sort((a, b) => b.p - a.p || a.i - b.i)) {
    if (gekozen.length >= aantal) break;
    if (kandidaat.p <= 0 && gekozen.length >= 2) break;
    if (gekozen.some((g) => Math.abs(g - kandidaat.i) === 1) && score.filter((x) => !gekozen.includes(x.i) && !gekozen.some((g) => Math.abs(g - x.i) === 1) && x.p > 0).length) continue;
    gekozen.push(kandidaat.i);
  }
  return gekozen.sort((a, b) => a - b).map((i) => d[i]);
}
function coreAantal(d) { return d.core && !d.core.intakeNodig && !d.core.opSlot ? (d.core.frequentie || 3) : 0; }

function datumKort(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }); }
function schemaKaart(d) {
  const s = d.schema; if (!s) return '';
  const kop = (h2, sub) => `<div class="sk-kop"><div class="label">Jouw ${s.winter ? 'winterprogramma' : 'schema'} &middot; ${esc(s.titel)}</div><h2>${h2}</h2><div class="sk-sub">${sub}</div></div>`;
  if (s.status === 'voor') {
    return `<div class="sk">${kop('Bijna begonnen', 'Je schema start op ' + esc(datumKort(s.start)) + '.')}
      <div class="sk-dag"><a class="knop sk-tpgroot" href="https://app.trainingpeaks.com/#calendar" target="_blank" rel="noopener">Bekijk je schema in TrainingPeaks</a>
      <p class="sk-tpzin">Daar staat je eerste week al klaar. Zet je teller of Zwift alvast aan je TrainingPeaks vast.</p>
      ${coreBlokHtml(d, null)}${coachTegelHtml('Vragen voor je start? Over je schema, je eerste test of je week')}</div></div>`;
  }
  if (s.status === 'klaar') {
    return `<div class="sk">${kop('Schema afgerond', 'Alle ' + s.weken + ' weken zitten erop. Knap gedaan.')}
      <div class="sk-dag"><p class="sk-rust">Wat nu? Bouw verder met een vervolgschema dat aansluit op waar je nu staat, of blijf Pro en houd je coach, de Core-app en je ritadvies.</p>
      <div class="sk-acties"><a class="knop" href="https://michelkredercoaching.nl/trainingsschema-vervolg/">Kies je vervolgschema</a>${isLid(d) && d.lid && d.lid.bron !== 'schema' ? '' : '<button class="knop leeg" data-actie="naarlid">Blijf Pro</button>'}</div></div></div>`;
  }
  // Simpel (15-10-2026): TrainingPeaks is leidend, de app wijst ernaar. Core als eigen blok met knop.
  const coreBlok = coreBlokHtml(d, s);
  return `<div class="sk">${kop('Week ' + s.week + ' van ' + s.weken, (s.niveau ? esc(s.niveau) + ' &middot; ' : '') + 'je traint in TrainingPeaks')}
    <div class="sk-dag"><a class="knop sk-tpgroot" href="https://app.trainingpeaks.com/#calendar" target="_blank" rel="noopener">Open je training in TrainingPeaks</a>
    <p class="sk-tpzin">Daar staat altijd je actuele schema, ook als Michel het voor jou heeft aangepast.</p>
    ${coreBlok}
    ${coachTegelHtml('Over je schema, je week of een training')}</div></div>`;
}
async function skSchuif(r) {
  if (D && D.beheer && BEKIJK === 'zelf' && SIM.schema !== 'echt') return;
  try {
    const j = await fetch(API + '?actie=schema', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken(), verschuif: Number(r) }) }).then((x) => x.json());

document.addEventListener('click', (e) => {

document.addEventListener('click', async (e) => {
  const k = e.target.closest('[data-kl]'); if (!k) return;
  if (k.dataset.kl === 'hard') { sbBewaarKeuze({ klHard: k.dataset.w === '1' }); return sbTeken(); }
  if (k.dataset.kl === 'kou') { SB.profiel.kouType = k.dataset.w; SB.profiel.kouGekozen = true; sbTeken(); await sbBewaarProfiel(true); }
  if (k.dataset.kl === 'rvmodus') { sbBewaarKeuze({ rvModus: k.dataset.w }); return sbTeken(); }
  if (k.dataset.kl === 'dvsoort') { sbBewaarKeuze({ dvSoort: k.dataset.w, dvDag: dvVandaagStr(0) }); return sbTeken(); }
  if (k.dataset.kl === 'dvmorgen') { sbBewaarKeuze({ dvMorgen: k.checked, dvMorgenDag: dvVandaagStr(0) }); return sbTeken(); }
  if (k.dataset.kl === 'zweetweg') { e.preventDefault(); SB.profiel.zweet = null; sbTeken(); await sbBewaarProfiel(true); return; }
  if (k.dataset.kl === 'zweet') {
    const num = (id) => Number(String(document.getElementById(id)?.value || '').replace(',', '.'));
    const voor = num('ztVoor'), na = num('ztNa'), duur = num('ztDuur'), dronk = num('ztDronk'), temp = num('ztTemp');
    const lpu = (voor - na + dronk * 0.75) / duur;
    if (!(voor >= 40 && voor <= 150 && na >= 40 && na <= 150) || !(duur > 0)) SB.zweetFout = 'Vul je gewicht voor en na de rit in.';
    else if (!(voor - na > -1 && lpu >= 0.2 && lpu <= 3)) SB.zweetFout = 'Dat lijkt niet te kloppen. Check je gewichten en wat je dronk.';
    else { SB.zweetFout = ''; SB.profiel.zweet = { lpu: Math.round(lpu * 100) / 100, temp: Number.isFinite(temp) ? Math.round(temp) : 15, op: dvVandaagStr(0) }; }
    sbTeken(); if (!SB.zweetFout) await sbBewaarProfiel(true); return;
  }
  if (k.dataset.kl === 'gewend') { SB.profiel.rvGewend = SB.profiel.rvGewend === k.dataset.w ? null : k.dataset.w; sbTeken(); await sbBewaarProfiel(true); }
  if (k.dataset.kl === 'tab') { if (k.dataset.w === 'kleding') statEens('kleding'); sbBewaarKeuze({ tab: k.dataset.w }); return sbTeken(); }
  if (k.dataset.kl === 'vrijtab') { btBewaar({ ...btLees(), tab: k.dataset.w }); return teken(); }
});

function statEens(e) {
  try {
    const k = 'mkcStat:' + e + ':' + new Date().toISOString().slice(0, 10);
    if (localStorage.getItem(k)) return;
    localStorage.setItem(k, '1');
  } catch (er) {}
  try { fetch(API + '?actie=stat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken(), e }), keepalive: true }); } catch (er) {}
}

    try { const j = await (await fetch(`${API}?actie=pushtest`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken() }) })).json(); PUSH.melding = j.ok ? 'Verstuurd. Je melding komt zo binnen.' : (j.fout || 'Versturen lukte niet.'); }
    catch (er) { PUSH.melding = 'Verbinding mislukt.'; }
    PUSH.bezig = false; return sbTeken();
  }
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'pushTijd') return;
  PUSH.inst = PUSH.inst || { aan: false, tijd: '07:00', dagen: [0, 1, 2, 3, 4, 5, 6] };
  PUSH.inst.tijd = e.target.value;
  if (PUSH.inst.aan) { await pushOpslaan({}); sbTeken(); }
});

// Pacingplan-link (15-10-2026): /app?pacing=<token>. Werkt zonder inloggen, net als de analyselink.
async function toonPacing(p) {
  $('#app').innerHTML = '<div class="pc-kaart"><p class="klein">Even laden...</p></div>';
  let j = null; try { j = await (await fetch(API + '?actie=pacinglink&p=' + encodeURIComponent(p))).json(); } catch (e) {}
  const dag = (iso) => new Date(iso).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  const inhoud = !j || !j.ok ? `<h2>Deze link werkt niet</h2><p>${esc((j && j.fout) || 'Probeer het zo nog eens.')}</p>`
    : j.status === 'te-vroeg' ? `<span class="tag oranje">Opent ${esc(dag(j.opent))}</span><h2>Je pacingplan${j.tocht ? ' voor ' + esc(j.tocht) : ''}</h2><p>We maken je plan pas 5 dagen voor je tocht, zodat al je trainingen erin zitten. Op ${esc(dag(j.opent))} krijg je een berichtje, dan koppel je Strava en staat je plan meteen klaar.</p>`
    : j.status === 'open' ? `<span class="tag oranje">Nu te maken</span><h2>Je pacingplan${j.tocht ? ' voor ' + esc(j.tocht) : ''}</h2><p>Koppel je Strava. We halen je ritten op, rekenen je tempo per klim en je voeding uit en ontkoppelen daarna meteen.</p><p class="klein">Zet bij Strava het vinkje voor je privé-ritten aan, anders missen we juist je trainingen.</p><button type="button" class="knop" disabled>Koppel je Strava (komt binnenkort)</button>`
    : `<h2>Deze link is verlopen</h2><p>Je tocht is begonnen of voorbij. Ging hij niet door? Stuur Michel een berichtje, dan zetten we je plan over.</p>`;
  $('#app').innerHTML = `<div class="pc-kaart"><div class="login-kop" style="margin-bottom:18px"><div class="logo">MKC<span>.</span></div><div class="van">Michel Kreder Coaching</div></div><div class="kaart actief"><div class="kaart-in">${inhoud}</div></div><p class="klein" style="text-align:center;margin-top:16px"><a href="/app" style="color:var(--accent)">Naar de MKC-app</a></p></div>`;
}
async function laadOverzicht() {
  { const pc = new URLSearchParams(location.search).get('pacing'); if (pc) return toonPacing(pc); }
  const t = leesToken();
  // Zonder inlog (13-10-2026): /app is de ingang voor nieuwe mensen (inloggen of gratis account maken).
  // De bandencheck zonder account staat op /banden, een groepsrit op /rit/..., en ?banden blijft werken.
  if (!t) {
    const p = new URLSearchParams(location.search), banden = location.pathname.startsWith('/banden') || p.has('banden');
    let gastGekozen = false; try { gastGekozen = !!localStorage.getItem('mkcGastKeuze'); } catch (e) {}
    if (GR_PAD || (banden && !(isApp() && !gastGekozen))) return toonGast();
    return toonLogin();
  }
  zetLoginInApp(t);
  try {
    const r = await fetch(API + '?actie=overzicht&t=' + encodeURIComponent(t));
    const j = await r.json();
    if (!j.ok) { wisToken(); return toonLogin(j.fout, 'fout'); }
    D = j; teken(); naarAnker(); pushLaad(); vriendKoppel(); if (NA_BETALING) naBetalingTonen(); else badgeFeest(); setTimeout(installEenmaal, 2500);
    if (D.beheer && BEKIJK === 'zelf' && SIM.schema && SIM.schema.includes('|')) simSchemaLaad(SIM.schema).then(teken);
    if (D.beheer && !D.schema) simSchemaLaad('opbouw-12-w|18').then(() => { if (BEKIJK === 'alles') teken(); });
    if (D.beheer && OPV.meldingen === null) opvLaad();
  } catch { $('#app').innerHTML = '<div class="laden">Verbinding mislukt. Probeer het zo nog eens.</div>'; }
}

// Na de betaling (13-10-2026): een welkom met de eerste stappen, of uitleg als het (nog) niet lukte.
let NA_BETALING = null;
function naBetalingTonen() {
  if (!NA_BETALING || !D || D.gast) return;
  const soort = NA_BETALING; NA_BETALING = null;
  if (soort === 'welkom') return modal(`<div class="md-modal"><div class="md-unlock">Welkom met Pro</div><h3 style="margin-top:8px">Je hebt nu alles</h3><p>Fijn dat je erbij bent. Met deze drie stappen staat je app helemaal goed:</p>
    <ol class="pm-stappen" style="text-align:left"><li><b>Zet je fiets erin</b><span>Bij Vandaag rijden: dan zie je elke dag je spanning, kleding en voeding.</span></li><li><b>Start de Core-app</b><span>${D && D.voorLancering ? 'Gaat open op vrijdag 16 oktober om 12:00. Je eerste maand begint ook pas dan.' : 'Een korte intake van een minuut, dan staat je eerste sessie klaar.'}</span></li><li><b>Zet je ochtendbericht aan</b><span>Elke ochtend om 7:00 alles voor je rit op je telefoon.</span></li></ol>
    <button type="button" class="knop" data-view="rijden">Begin met je fiets</button><button type="button" class="sb-link" data-lx="dicht" style="display:block;margin:8px auto 0">Later</button></div>`);
  modal(`<h3>Je betaling is nog niet binnen</h3><p>Dat kan gebeuren als je de betaling hebt afgebroken, of als je bank er even over doet. Zonder geslaagde betaling wordt er niets afgeschreven.</p><p class="klein">Kwam de betaling wel door? Dan staat je Pro er binnen een paar minuten. Ververs de app dan even.</p><button type="button" class="knop" data-view="lid">Opnieuw proberen</button><button type="button" class="sb-link" data-lx="dicht" style="display:block;margin:8px auto 0">Sluiten</button>`);
}
async function start() {
  const p = new URLSearchParams(location.search);
  // Login uit de mail-knop of de app-start (?t=), of doorklik vanuit de Core-app (?ct=).
  if (p.get('t')) bewaarToken(p.get('t'));
  if (p.get('ct')) {
    try {
      const r = await fetch(API + '?actie=vancore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ct: p.get('ct') }) });
      const j = await r.json(); if (j.ok && j.t) bewaarToken(j.t);
    } catch (e) {}
  }
  if (p.get('lid') === 'terug') {
    $('#app').innerHTML = '<div class="laden">Bedankt! Je betaling wordt verwerkt...</div>';
    let gelukt = false;
    for (let i = 0; i < 8; i++) {
      await new Promise((r) => setTimeout(r, 1500));
      try { const s = await (await fetch('/api/lid?actie=status&t=' + encodeURIComponent(leesToken()))).json(); if (s.ok && s.lid && s.lid.status === 'actief') { gelukt = true; break; } } catch (e) {}
    }
    // Na betalen terug op Mijn Pro (16-10-2026, Michel): status, facturen en vrienden uitnodigen, met de welkomstuitleg erover.
    try { history.replaceState(null, '', location.pathname + '#lid'); } catch (e) {}
    NA_BETALING = gelukt ? 'welkom' : 'niet';
  }
  return laadOverzicht();
}
start();
</script>
