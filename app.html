<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MKC | Michel Kreder Coaching</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="/app.webmanifest" id="manifestLink">
<link rel="apple-touch-icon" href="/icoon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* De all-in-1 app (06-10-2026), stap 2 van APP-STAPPENPLAN.md.
     Zelfde huisstijl als de homepage: Bebas Neue + DM Sans, zwart met oranje.
     Gegevens komen uit /api/app; de Core-app zelf blijft mijn-core.html. */
  :root { --black:#0A0A0A; --off:#111; --surface:#161616; --surface2:#1c1c1c; --border:rgba(255,255,255,0.08);
    --white:#F5F3EF; --muted:rgba(245,243,239,0.6); --accent:#FF6B1A; --accent-dim:rgba(255,107,26,0.12); --groen:#4CC38A; }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--black); }
  body { font-family:'DM Sans',sans-serif; background:var(--black); color:var(--white); -webkit-font-smoothing:antialiased; line-height:1.55; min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  .wrap { max-width:560px; margin:0 auto; }
  a { color:inherit; }
  .kop { display:flex; align-items:center; justify-content:space-between; padding:8px 2px 22px; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:.06em; line-height:1; }
  .logo span { color:var(--accent); }
  .uit { font-size:12.5px; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer; font-family:inherit; }
  .groet { font-family:'Bebas Neue',sans-serif; font-size:clamp(40px,11vw,56px); line-height:.92; text-transform:uppercase; margin-bottom:8px; }
  .groet em { font-style:normal; color:var(--accent); }
  .intro { font-size:15px; color:var(--muted); margin-bottom:24px; }
  .label { display:inline-flex; align-items:center; gap:8px; font-size:10.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  .label::before { content:''; width:16px; height:1px; background:var(--accent); }

  /* Kaarten */
  .kaarten { display:grid; gap:14px; }
  .kaart { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; position:relative; }
  .kaart.actief { border-color:rgba(255,107,26,.45); background:linear-gradient(180deg, rgba(255,107,26,.08), var(--surface) 55%); }
  .kaart-in { padding:20px 20px 20px; }
  .kaart h2 { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:.95; text-transform:uppercase; margin-bottom:6px; }
  .kaart p { font-size:14.5px; color:rgba(245,243,239,.78); }
  .kaart .tag { position:absolute; top:16px; right:16px; font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; border-radius:3px; }
  .tag.open { color:var(--groen); border:1px solid rgba(76,195,138,.45); }
  .tag.slot { color:var(--muted); border:1px solid rgba(255,255,255,.15); }
  .tag.oranje { color:var(--black); background:var(--accent); }
  .knop { display:block; width:100%; text-align:center; background:var(--accent); color:#0A0A0A; text-decoration:none; border:0; cursor:pointer;
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.06em; text-transform:uppercase; padding:14px 18px 11px; border-radius:4px; margin-top:16px; }
  .knop.leeg { background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.2); }
  .klein { font-size:12.5px; color:var(--muted); margin-top:10px; }
  .cijfers { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 4px; }
  .cijfer { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px 10px 8px; }
  .cijfer span { display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .cijfer b { font-family:'Bebas Neue',sans-serif; font-size:28px; line-height:1.05; font-weight:400; }
  .cijfer b em { font-style:normal; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; color:var(--groen); margin-left:4px; }
  .volgende { display:grid; grid-template-columns:42% 1fr; gap:12px; align-items:center; margin-top:14px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
  .volgende svg { width:100%; height:auto; display:block; }
  .volgende .w { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .volgende .n { font-weight:600; font-size:15px; margin:2px 0 4px; }
  .volgende .m { font-size:12.5px; color:var(--muted); }
  .balk { height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; margin-top:14px; }
  .balk i { display:block; height:100%; background:var(--accent); }

  /* Op slot: echte inhoud wazig, slot erover */
  .wazig { position:relative; }
  .wazig .achter { filter:blur(5px) grayscale(.5); opacity:.45; pointer-events:none; user-select:none; }
  .wazig .slotje { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:12px; }
  .slotje svg { width:26px; height:26px; color:var(--white); }
  .slotje b { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.04em; }
  .nepgrafiek { height:86px; margin-top:14px; border-radius:6px; background:linear-gradient(180deg, rgba(255,107,26,.15), transparent); position:relative; overflow:hidden; }
  .nepgrafiek svg { width:100%; height:100%; display:block; }

  .beheer { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 10px; background:#1d1408; border:1px dashed rgba(255,107,26,.5); border-radius:6px; padding:8px 10px; margin-bottom:16px; font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .beheer button { background:transparent; border:1px solid rgba(255,255,255,.15); color:var(--muted); font-family:inherit; font-size:12px; padding:5px 10px; cursor:pointer; }
  .beheer button.aan { background:var(--accent); color:#0A0A0A; border-color:var(--accent); }
  .sim { display:grid; grid-template-columns:1fr 1fr; gap:10px; background:#1d1408; border:1px dashed rgba(255,107,26,.5); border-top:0; border-radius:0 0 6px 6px; padding:12px 10px; margin:-16px 0 16px; }
  .sim label { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .sim label span { font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .sim select { width:100%; min-width:0; background:var(--black); color:var(--white); border:1px solid rgba(255,255,255,.18); border-radius:4px; padding:8px; font-family:inherit; font-size:13.5px; }
  .sim button { grid-column:1 / -1; background:transparent; border:1px solid rgba(255,255,255,.15); color:var(--muted); font-family:inherit; font-size:12px; padding:7px; cursor:pointer; border-radius:4px; }
  .lidblok { border:1px solid rgba(255,107,26,.55); background:linear-gradient(160deg, rgba(255,107,26,.16), var(--surface) 60%); border-radius:8px; padding:20px; margin-bottom:6px; }
  .lidblok h2 { font-family:'Bebas Neue',sans-serif; font-size:32px; line-height:.95; text-transform:uppercase; margin:2px 0 8px; }
  .lidblok .prijs { font-family:'Bebas Neue',sans-serif; font-size:46px; line-height:1; }
  .lidblok .prijs small { font-family:'DM Sans',sans-serif; font-size:14px; color:var(--muted); margin-left:4px; }
  .lidblok ul { list-style:none; margin:12px 0 4px; display:grid; gap:7px; }
  .lidblok li { display:flex; gap:10px; font-size:14.5px; color:rgba(245,243,239,.85); }
  .lidblok li::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:8px; }
  .lidrij { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:14px; }
  .lidrij b { color:var(--groen); }
  .lidrij.waarschuw b { color:#ff8a5c; }
  .lidrij button { background:none; border:0; color:var(--muted); text-decoration:underline; font-family:inherit; font-size:13px; cursor:pointer; }
  .groepkop { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:26px 2px 10px; }
  .groepkop:first-of-type { margin-top:4px; }
  .binnenkort { opacity:.8; }
  .binnenkort h2 { color:rgba(245,243,239,.85); }

  .plan .knop[disabled] { opacity:.45; cursor:default; }
  .lid-akkoord { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:rgba(245,243,239,.8); margin:14px 0 4px; line-height:1.45; cursor:pointer; border-radius:6px; padding:6px; transition:background .2s; }
  .lid-akkoord input { flex:0 0 18px; width:18px; height:18px; margin-top:1px; accent-color:#FF6B1A; }
  .lid-akkoord a { color:#FF6B1A; }
  .lid-akkoord.fout { background:rgba(255,107,26,.18); outline:1px solid #FF6B1A; }
  /* Beginscherm-kaart */
  .appkaart { display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid rgba(255,107,26,.4); border-radius:8px; padding:14px; margin-bottom:18px; position:relative; }
  .appkaart img { width:52px; height:52px; border-radius:12px; flex-shrink:0; }
  .appkaart b { display:block; margin-bottom:2px; }
  .appkaart .stap { font-size:13.5px; color:var(--muted); }
  .appkaart .x { position:absolute; top:6px; right:10px; background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; }
  .deelicoon { width:15px; height:17px; vertical-align:-3px; }
  .appkaart .knop { width:auto; display:inline-block; font-size:17px; padding:8px 14px 6px; margin-top:8px; }

  /* Inloggen (09-10-2026): rustig, zelfverzekerd, twee stappen */
  .login { min-height:calc(100vh - 80px); display:flex; flex-direction:column; padding-top:4vh; }
  .login-kop { display:flex; align-items:center; justify-content:space-between; margin-bottom:5vh; }
  .login-kop .van { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .login h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(44px,12.5vw,68px); line-height:.9; text-transform:uppercase; margin-bottom:14px; letter-spacing:.01em; }
  .login h1 em { font-style:normal; color:var(--accent); }
  .login .lead { color:var(--muted); font-size:15px; line-height:1.55; margin-bottom:20px; max-width:420px; }
  .login-punten { list-style:none; display:grid; gap:9px; margin:0 0 22px; }
  .login-punten li { display:flex; align-items:center; gap:12px; font-size:14px; line-height:1.35; color:rgba(245,243,239,.88); }
  .login-punten .ic { flex:0 0 32px; height:32px; border-radius:50%; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; }
  .login-punten svg { width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .login-vak { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .login-vak label { display:block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .login input { width:100%; background:var(--black); border:1px solid rgba(255,255,255,.14); color:var(--white); font-family:inherit; font-size:16px; padding:15px 16px; border-radius:6px; margin-bottom:12px; transition:border-color .15s; }
  .login input:focus { outline:none; border-color:var(--accent); }
  .login .codeveld { letter-spacing:10px; font-size:26px; text-align:center; font-weight:600; }
  .login-naar { font-size:14px; color:var(--muted); margin-bottom:14px; line-height:1.5; }
  .login-naar b { color:var(--white); font-weight:600; overflow-wrap:anywhere; }
  .login-terug { background:none; border:0; color:var(--accent); font-family:inherit; font-size:13.5px; cursor:pointer; padding:0; }
  .login-terug:disabled { opacity:.5; }
  .login-acties { display:flex; justify-content:space-between; margin-top:12px; }
  .login-bewijs { display:flex; align-items:center; gap:12px; margin-top:26px; padding-top:20px; border-top:1px solid var(--border); }
  .login-bewijs img { width:42px; height:42px; border-radius:50%; }
  .login-bewijs div { font-size:13px; color:var(--muted); line-height:1.45; }
  .login-bewijs b { color:var(--white); font-weight:600; }
  .login-bewijs .ster { color:var(--accent); letter-spacing:1px; }
  .login-voet { margin-top:auto; padding-top:28px; font-size:12px; color:rgba(245,243,239,.42); line-height:1.6; }
  .melding { font-size:14px; margin-top:14px; color:var(--muted); }
  .melding.goed { color:var(--groen); }
  .melding.fout { color:#ff8a5c; }
  .laden { text-align:center; padding:30vh 0; color:var(--muted); }
  /* Bandenspanning in de app */
  .bt { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0 4px; }
  .bt label { display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .bt input, .bt select { width:100%; background:var(--surface2); border:1px solid rgba(255,255,255,.14); color:var(--white); font-family:inherit; font-size:16px; padding:10px 10px; border-radius:4px; -webkit-appearance:none; appearance:none; }
  .bt input:focus, .bt select:focus { outline:none; border-color:var(--accent); }
  .bt-keuze { display:flex; gap:6px; grid-column:1 / -1; }
  .bt-keuze button { flex:1; background:var(--surface2); border:1px solid rgba(255,255,255,.14); color:var(--muted); font-family:inherit; font-size:13.5px; padding:9px 6px; border-radius:4px; cursor:pointer; }
  .bt-keuze button.aan { border-color:var(--accent); color:var(--white); background:rgba(255,107,26,.12); }
  .bt-uit { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .bt-uit div { background:var(--surface2); border:1px solid rgba(255,107,26,.35); border-radius:6px; padding:10px 12px 8px; }
  .bt-uit span { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .bt-uit b { font-family:'Bebas Neue',sans-serif; font-size:40px; line-height:1; font-weight:400; }
  .bt-uit small { font-size:12.5px; color:var(--muted); margin-left:4px; }
  .bt-slim { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:13.5px; color:var(--muted); }
  .bt-slim b { color:var(--white); }
  /* Slimme bandenspanning (leden) */
  .sb-weer { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin:14px 0 10px; font-size:14px; color:rgba(245,243,239,.85); }
  .sb-weer b { color:var(--white); }
  .sb-weer b.nat { color:#6db3ff; }
  .sb-weer > button { background:none; border:0; color:var(--muted); text-decoration:underline; font-family:inherit; font-size:12.5px; cursor:pointer; }
  .sb-weer.leeg { display:block; }
  .sb-plek { display:grid; grid-template-columns:auto 1fr; gap:8px; margin-top:10px; }
  .sb-plek .knop { width:auto; font-size:16px; padding:9px 12px 7px; }
  .sb-plek input, .sb-rij input, .sb-bewerk input, .sb-bewerk select { width:100%; background:var(--black); border:1px solid rgba(255,255,255,.14); color:var(--white); font-family:inherit; font-size:16px; padding:10px; border-radius:4px; }
  .sb-zoek { display:grid; gap:4px; margin-top:8px; }
  .sb-zoek button { text-align:left; background:var(--black); border:1px solid var(--border); color:var(--white); font-family:inherit; font-size:14px; padding:9px 10px; border-radius:4px; cursor:pointer; }
  .sb-zoek small { color:var(--muted); }
  .sb-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .sb-chips button { background:var(--surface2); border:1px solid rgba(255,255,255,.14); color:var(--muted); font-family:inherit; font-size:14px; padding:8px 12px; border-radius:20px; cursor:pointer; }
  .sb-chips button.aan { border-color:var(--accent); color:var(--white); background:rgba(255,107,26,.14); }
  .sb-chips small { opacity:.6; margin-left:2px; }
  .sb-grond { flex-wrap:wrap; margin-bottom:6px; }
  .sb-grond button { min-width:30%; }
  .kaart .bt-keuze + .bt-keuze { margin-top:6px; }
  .sb-kou { margin-top:10px; background:rgba(109,179,255,.08); border:1px solid rgba(109,179,255,.3); border-radius:6px; padding:10px 12px; font-size:14px; color:rgba(245,243,239,.85); }
  .sb-kou b { color:var(--white); }
  .sb-vraag { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .sb-vraag label, .sb-bewerk label { display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .sb-rij { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .sb-rij .knop { width:auto; font-size:17px; padding:9px 14px 7px; }
  .sb-antwoord { margin-top:10px; background:var(--surface2); border-left:3px solid var(--accent); border-radius:4px; padding:10px 12px; font-size:14.5px; white-space:pre-wrap; }
  .sb-link { display:block; margin-top:14px; background:none; border:0; color:var(--muted); text-decoration:underline; font-family:inherit; font-size:13px; cursor:pointer; }
  .sb-bewerk { margin-top:12px; display:grid; gap:10px; }
  .sb-fiets { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px; display:grid; gap:6px; }
  .sb-fiets .bt-keuze select { flex:1; }
  .sb-weg { background:none; border:1px solid rgba(255,255,255,.14); color:var(--muted); font-size:20px; width:42px; border-radius:4px; cursor:pointer; }
  /* Gratis bandentool: de slimme versie wazig als voorproefje */
  .bt-slot { position:relative; margin-top:14px; border:1px solid rgba(255,107,26,.35); border-radius:8px; overflow:hidden; }
  .bt-slot .achter { filter:blur(2px); opacity:.8; pointer-events:none; user-select:none; padding:12px; }
  .bt-slot .achter .sb-weer, .bt-slot .achter .sb-kou { margin:0 0 8px; }
  .bt-slot .voor { position:relative; border-top:1px solid rgba(255,107,26,.25); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; padding:14px; background:rgba(255,107,26,.06); }
  .bt-slot .voor svg { width:22px; height:22px; }
  .bt-slot .voor b { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.03em; line-height:1.05; }
  .bt-slot .voor span { font-size:13px; color:rgba(245,243,239,.8); max-width:280px; }
  .bt-slot .voor .knop { width:auto; font-size:16px; padding:8px 14px 6px; margin-top:4px; }
  /* MKC-coach */
  .cc-fab { position:fixed; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:40; display:flex; align-items:center; gap:10px; background:var(--accent); color:#0A0A0A; border:none; border-radius:99px; padding:6px 18px 6px 6px; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.05em; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,107,26,.4); }
  .cc-fab .cc-av { width:38px; height:38px; }
  .cc-av { border-radius:50%; background:#0A0A0A; border:2px solid var(--accent); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cc-av img { width:100%; height:100%; display:block; }
  .cc-paneel { position:fixed; right:16px; bottom:16px; z-index:45; width:min(400px, calc(100vw - 32px)); height:min(620px, calc(100vh - 32px)); background:#101010; border:1px solid rgba(255,107,26,.35); border-radius:14px; display:none; flex-direction:column; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.7); }
  .cc-paneel.open { display:flex; }
  .cc-kop { display:flex; align-items:center; gap:12px; padding:14px 14px 12px; border-bottom:1px solid var(--border); background:linear-gradient(180deg, rgba(255,107,26,.09), transparent); }
  .cc-kop .cc-av { width:44px; height:44px; }
  .cc-kop .nm { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.04em; line-height:1; display:flex; align-items:center; gap:8px; }

<body>
<div class="wrap" id="app"><div class="laden">Even laden...</div></div>

<script src="/core-programma/spierkaart.js"></script>
<script>
const API = '/api/app';
const OPSLAG = 'mkc_app_t';
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// AI-antwoorden netjes tonen: eerst alles escapen, dan **vet** echt vet,
// opsommingen met een bolletje en losse sterretjes of hekjes weg. De coaches
// krijgen de opdracht platte tekst te schrijven, dit vangt de rest op.
function opmaak(t) {
  return String(t == null ? '' : t).split('\n').map((r) => {
    let s = esc(r).replace(/^\s*#{1,6}\s*/, '');
    s = s.replace(/^\s*[-*•]\s+/, '&bull; ');
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<b>$1</b>').replace(/\*/g, '');
    return s;
  }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
const SLOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const SITE = 'https://michelkredercoaching.nl';
// Analyse kopen = direct naar de checkout met product 12131 in het mandje (de
// korte checkout uit checkout-analyse-minimaal.php), niet via de productpagina.
const ANALYSE_KOOP = SITE + '/checkout/?add-to-cart=12131';
let BEKIJK = (() => { try { return localStorage.getItem('mkcBekijk') || 'klant'; } catch { return 'klant'; } })(); // beheerweergave: 'nieuw' (niet-lid, nog niets gekocht), 'klant' (je eigen account) of 'alles'
let D = null;

function leesToken() { try { return localStorage.getItem(OPSLAG) || ''; } catch (e) { return ''; } }
function bewaarToken(t) { try { localStorage.setItem(OPSLAG, t); } catch (e) {} zetLoginInApp(t); }
// iPhone: een app op het beginscherm heeft eigen opslag. Daarom zit de login
// ook in de adresbalk en in een persoonlijk manifest; zet je de app op je
// beginscherm terwijl je ingelogd bent, dan gaat je login mee.
function zetLoginInApp(t) {
  if (!t) return;
  try { history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(t)); } catch (e) {}
  const m = document.getElementById('manifestLink');
  if (m) m.href = API + '?actie=manifest&t=' + encodeURIComponent(t);
}
function wisToken() { try { localStorage.removeItem(OPSLAG); } catch (e) {} try { history.replaceState(null, '', location.pathname); } catch (e) {} const m = document.getElementById('manifestLink'); if (m) m.href = '/app.webmanifest'; }

// ---- Beginscherm ----
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; if (D) teken(); });
function isApp() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function appHtml() {
  let weg = false; try { weg = localStorage.getItem('mkcAppWeg') === '1'; } catch (e) {}
  const telefoon = window.matchMedia('(pointer: coarse)').matches;
  if (isApp() || weg || !telefoon) return '';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const deel = '<svg class="deelicoon" viewBox="0 0 15 17" fill="none" stroke="#FF6B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1v10M4 4.5 7.5 1 11 4.5M3 7.5H1.5v8h12v-8H12"/></svg>';
  const uitleg = installPrompt
    ? '<button class="knop" data-actie="installeer">Zet op beginscherm</button>'
    : ios ? `<div class="stap">Tik onderaan in Safari op ${deel} en kies <b style="display:inline;color:var(--white)">Zet op beginscherm</b>.</div>`
          : '<div class="stap">Open het menu van je browser (&#8942;) en kies <b style="display:inline;color:var(--white)">Toevoegen aan startscherm</b>.</div>';
  return `<div class="appkaart"><img src="/icoon-180.png" alt="">
    <div><b>Zet MKC op je beginscherm</b><div class="stap">Dan open je alles met één tik, als app.</div>${uitleg}</div>
    <button class="x" data-actie="appweg" aria-label="Sluiten">&times;</button></div>`;
}

// ---- Inloggen ----
// Twee stappen: mailadres, dan de code uit de mail. Nieuw adres = gratis account.
const LOGIN_PUNTEN = [
  ['band', 'Bandenspanning voor elke rit, afgestemd op het weer'],
  ['core', 'Core-training die met je meebeweegt'],
  ['kleding', 'Kledingadvies en een ochtendbericht voor je rit'],
  ['coach', 'Je vragen beantwoord met de kennis van Michel']
];
const LOGIN_IC = {"band":"<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"3.5\"/></svg>","core":"<svg viewBox=\"0 0 24 24\"><path d=\"M4 18h16M7 18V9l5-4 5 4v9\"/></svg>","kleding":"<svg viewBox=\"0 0 24 24\"><path d=\"M12 3v2M5.6 5.6l1.4 1.4M3 12h2M18.4 5.6 17 7M21 12h-2\"/><path d=\"M7 16a5 5 0 0 1 10 0\"/><path d=\"M3 20h18\"/></svg>","coach":"<svg viewBox=\"0 0 24 24\"><path d=\"M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z\"/></svg>"};
function loginHtml(melding, soort) {
  return `<div class="login">
    <div class="login-kop"><div class="logo">MKC<span>.</span></div><div class="van">Michel Kreder Coaching</div></div>
    <h1>Train slimmer.<br><em>Rij sterker.</em></h1>
    <p class="lead">Alles voor je training op één plek, van je eerste rit van de dag tot je volgende stap.</p>
    <ul class="login-punten">${LOGIN_PUNTEN.map(([i, t]) => `<li><span class="ic">${LOGIN_IC[i]}</span>${t}</li>`).join('')}</ul>
    <div class="login-vak">
      <form id="loginForm"><label for="loginMail">Inloggen of account maken</label>
        <input type="email" id="loginMail" placeholder="naam@voorbeeld.nl" autocomplete="email" required>
        <button class="knop" type="submit" id="loginKnop">Ga verder</button></form>
      <form id="codeForm" style="display:none"><label for="loginCode">Je inlogcode</label>
        <p class="login-naar">We stuurden een code van 6 cijfers naar <b id="loginNaar"></b>.</p>
        <input type="text" id="loginCode" class="codeveld" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        <button class="knop" type="submit" id="codeKnop">Log in</button>
        <div class="login-acties"><button type="button" class="login-terug" id="anderAdres">Ander mailadres</button><button type="button" class="login-terug" id="opnieuw">Nieuwe code sturen</button></div></form>
      <div class="melding ${soort || ''}" id="loginMelding">${melding ? esc(melding) : ''}</div>
    </div>
    <div class="login-bewijs"><img src="/icoon-192.png" alt=""><div><b>Gebouwd door Michel Kreder</b>, 9 jaar profwielrenner en coach.<br><span class="ster">&#9733;&#9733;&#9733;&#9733;&#9733;</span> 4,9 &middot; 1000+ renners getraind</div></div>
    <p class="login-voet">Nieuw hier? Met je mailadres maak je meteen een gratis account. Je krijgt af en toe een tip van Michel per mail, afmelden kan altijd.</p>
  </div>`;
}
function toonLogin(melding, soort) {
  $('#app').innerHTML = loginHtml(melding, soort);
  const m = $('#loginMelding');
  const naarCode = (email) => {
    $('#loginForm').style.display = 'none'; $('#codeForm').style.display = 'block';
    $('#loginNaar').textContent = email; $('#loginCode').value = ''; $('#loginCode').focus();
  };
  const vraagCode = async (knop) => {
    const email = $('#loginMail').value.trim(), oud = knop.textContent;
    knop.disabled = true; knop.textContent = 'Even versturen...'; m.className = 'melding'; m.textContent = '';
    try {
      const r = await fetch(API + '?actie=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const j = await r.json();
      if (j.ok) { naarCode(email); m.className = 'melding'; m.textContent = 'Niets binnen na een minuut? Kijk even in je spam.'; }
      else { m.className = 'melding fout'; m.textContent = j.fout || 'Dat lukte niet. Probeer het zo nog eens.'; }
    } catch { m.className = 'melding fout'; m.textContent = 'Verbinding mislukt. Probeer het zo nog eens.'; }
    knop.disabled = false; knop.textContent = oud;
  };
  $('#loginForm').addEventListener('submit', (e) => { e.preventDefault(); vraagCode($('#loginKnop')); });
  $('#opnieuw').addEventListener('click', () => vraagCode($('#opnieuw')));
  $('#anderAdres').addEventListener('click', () => { $('#codeForm').style.display = 'none'; $('#loginForm').style.display = 'block'; m.textContent = ''; $('#loginMail').focus(); });
  // Zes cijfers ingevuld (ook via autofill uit de mail) = meteen inloggen.
  $('#loginCode').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) $('#codeForm').requestSubmit(); });
  $('#codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = $('#codeKnop'); if (knop.disabled) return;
    knop.disabled = true; knop.textContent = 'Even kijken...';
    try {
      const r = await fetch(API + '?actie=verifieer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#loginMail').value.trim(), code: $('#loginCode').value }) });
      const j = await r.json();
      if (j.ok && j.t) { bewaarToken(j.t); return laadOverzicht(); }
      m.className = 'melding fout'; m.textContent = j.fout || 'Dat lukte niet.';
    } catch { m.className = 'melding fout'; m.textContent = 'Verbinding mislukt. Probeer het zo nog eens.'; }
    knop.disabled = false; knop.textContent = 'Log in';
  });
}

// ---- Kaarten ----
function coreKaart(c) {
  if (!c) {
    return `<div class="kaart"><div class="kaart-in"><span class="tag oranje">Gratis week</span>
      <div class="label">Core-app</div><h2>Sterk tot de laatste km</h2>
      <p>Core op maat die met je meebeweegt, thuis zonder gewichten. Train mee op de timer en zie je Rompscore stijgen.</p>
      <div class="wazig" style="margin-top:14px"><div class="achter"><div class="cijfers"><div class="cijfer"><span>Niveau</span><b>3</b></div><div class="cijfer"><span>Rompscore</span><b>66</b></div><div class="cijfer"><span>Sessies</span><b>2/3</b></div></div></div>
        <div class="slotje">${SLOT}<b>${binnenkortNu() ? 'Binnenkort' : 'Week 1 is gratis'}</b></div></div>
      ${binnenkortNu() ? BINNENKORT : '<button class="knop" data-actie="startcore">Start je gratis week</button><p class="klein">Met je account, je hoeft niets meer in te vullen.</p>'}</div></div>`;
  }
  const K = window.CoreSpierkaart;
  if (c.intakeNodig) {
    return `<div class="kaart actief"><div class="kaart-in"><span class="tag open">Open</span><div class="label">Core-app</div>
      <h2>Je plan staat klaar</h2><p>Begin met een paar korte vragen over je klachten, dan stem ik je oefeningen af.</p>
      <a class="knop" href="${esc(c.link)}">Start met je intake</a></div></div>`;
  }
  if (c.opSlot) {
    return `<div class="kaart actief"><div class="kaart-in"><span class="tag oranje">Proefweek klaar</span><div class="label">Core-app</div>
      <h2>Niveau 2 staat klaar</h2><p>Je proefweek zit erop. Ga door en alles wat je deed blijft staan.</p>
      ${c.rompscore != null ? `<div class="cijfers"><div class="cijfer"><span>Rompscore</span><b>${c.rompscore}</b></div><div class="cijfer"><span>Niveau</span><b>1</b></div><div class="cijfer"><span>Prijs</span><b>${kanLidNu() ? '&euro;19<em style="color:var(--muted)">/mnd</em>' : '&euro;49'}</b></div></div>` : ''}
      ${kanLidNu() ? '<button class="knop" data-actie="naarlid">Word lid en ga door</button>' : `<a class="knop" href="${esc(c.link)}">Ga door naar niveau 2</a>`}</div></div>`;
  }
  const winst = c.rompscore != null && c.startScore != null && c.rompscore > c.startScore ? `<em>+${c.rompscore - c.startScore}</em>` : '';
  // Balk: hoe ver je bent in dit niveau (sessies gedaan van wat nodig is).
  const pct = Math.min(100, Math.round((c.gedaan / Math.max(1, c.frequentie)) * 100));
  const v = c.volgende;
  const kaartje = v && K ? `<div class="volgende"><div>${K.svg(K.vanSessie(v.oefeningen), { labels: false })}</div>
      <div><div class="w">Volgende: sessie ${'ABCD'.indexOf(v.letter) + 1}</div><div class="n">${esc(v.naam)}</div>
      <div class="m">${v.minuten} min &middot; ${esc(K.namenLijst(K.vanSessie(v.oefeningen)).hoofd.slice(0, 3).join(', '))}</div></div></div>` : '';
  return `<div class="kaart actief"><div class="kaart-in"><span class="tag open">${c.klaar ? 'Afgerond' : 'Actief'}</span>
    <div class="label">Core-app</div>
    <h2>${c.klaar ? 'Niveau 12 bereikt' : `Niveau ${c.week}`}</h2>
    <p>${c.klaar ? 'Knap gedaan. Als lid beweegt de app met je mee.' : `Fase: ${esc(c.faseNaam)} &middot; ${c.gedaan} van ${c.frequentie} sessies gedaan`}</p>
    ${(() => { const dz = zicht(); const cd = coreDagen(dz && dz.schema, coreAantal(dz || {})); return cd.length && !c.klaar ? `<p class="klein" style="color:#4CC38A;margin-top:-4px">Past bij je schema: ${cd.map((x) => x.dagnaam).join(', ')}</p>` : ''; })()}
    <div class="cijfers"><div class="cijfer"><span>Rompscore</span><b>${c.rompscore != null ? c.rompscore : '&ndash;'}${winst}</b></div>
      <div class="cijfer"><span>Niveau</span><b>${c.week}</b></div><div class="cijfer"><span>Gedaan</span><b>${c.afgerond}</b></div></div>
    <div class="balk"><i style="width:${c.klaar ? 100 : pct}%"></i></div>
    ${c.klaar ? '' : kaartje}
    <a class="knop" href="${esc(c.link)}">${c.klaar ? 'Open je Core-app' : v ? `Verder met sessie ${'ABCD'.indexOf(v.letter) + 1}` : 'Open je Core-app'}</a></div></div>`;
}

function nepGrafiek() {

// ---- Jouw Strava-analyse: inklapbaar blok bovenaan (08-10-2026) ----
// Voor wie een analyse kocht. Dicht: de kern in één regel. Open: cijfers,
// rennerstype, zones (Michels TrainingPeaks-zones), advies met tegoed.
const RENNERTYPES = {
  Sprinter: 'Korte, explosieve pieken ver boven je drempel. Je kracht zit in de sprint.',
  Puncheur: 'Sterk in korte, harde inspanningen boven je drempel. Ideaal voor aanvallen en korte hellingen.',
  Klimmer: 'Veel vermogen per kilo. Je motor houdt het lang volhoudend zwaar.',
  Tijdrijder: 'Een vlakke curve zonder grote pieken. Jij bent het sterkst op een constant, hoog tempo.',
  Allrounder: 'Geen uitgesproken piek of dal in je curve. Je kunt op meerdere manieren meedoen.'
};
const ZONES_W = [['Herstel', 0, 55], ['Duur', 56, 75], ['Tempo', 76, 85], ['Sweetspot', 86, 95], ['FTP', 96, 105], ['VO2max', 106, null]];
const ZONES_HR = [['Herstel', 0, 75], ['D1', 76, 85], ['D2', 86, 90], ['D3', 91, 100], ['Weerstand', 101, null]];
function analyseOpen() { try { return localStorage.getItem('mkcAnalyseOpen') === '1'; } catch (e) { return false; } }
function analyseBlok(a) {
  if (!a) return '';
  const hr = a.meet === 'hartslag';
  const basis = Number(String(hr ? a.omslag : a.ftp).replace(/[^0-9.]/g, '')) || 0;
  const eenheid = hr ? 'bpm' : 'W';
  const hoofd = basis ? `${hr ? 'Omslagpunt' : 'FTP'} ${basis} ${eenheid}` : 'Je analyse';
  const kort = [hoofd, a.type, a.score ? `score ${a.score}` : ''].filter(Boolean).join(' &middot; ');
  const open = analyseOpen();
  const kop = `<button type="button" class="an-kop" data-an="klap" aria-expanded="${open}"><span><small>Jouw Strava-analyse${a.datum ? ' &middot; ' + esc(a.datum) : ''}</small><b>${kort}</b></span><span class="an-pijl">${open ? '&#9650;' : '&#9660;'}</span></button>`;
  if (!open) return `<div class="an" id="analyse">${kop}</div>`;
  const dec = a.decoupling !== '' && a.decoupling != null ? Number(String(a.decoupling).replace(',', '.')) : null;
  const zones = (hr ? ZONES_HR : ZONES_W).map(([naam, van, tot]) => {
    const v = Math.round(basis * van / 100), t = tot != null ? Math.round(basis * tot / 100) : null;
    return `<tr><td>${naam}</td><td>${van}${tot != null ? '-' + tot : '+'}%</td><td><b>${van === 0 ? 'tot ' + t : t != null ? v + '-' + t : v + '+'}</b> ${eenheid}</td></tr>`;
  }).join('');
  return `<div class="an open" id="analyse">${kop}
    <div class="an-in">

// ---- Slimme bandenspanning voor leden (stap 3, 07-10-2026) ----
// Bewaarde fietsen (server, app:banden:<email>), het weer van vandaag op je
// eigen plek, ondergrond, en een vraagknop. Rekent met dezelfde formule als de
// gratis versie; daarbovenop alleen de vaste regels van de kaart (nat -0,3,
// kasseien -0,5, glad +0,3, los grind -0,3, tassen +0,4) en de kou-correctie.
const SB = { ritten: null, profiel: null, weer: null, weerFout: '', bewerk: false, zoek: [], antwoord: '', vraagBezig: false, vraag: '' };
const SB_KEUZE = 'mkcBandenKeuze';
function sbKeuze() { try { return JSON.parse(localStorage.getItem(SB_KEUZE) || '{}'); } catch (e) { return {}; } }
function sbBewaarKeuze(k) { try { localStorage.setItem(SB_KEUZE, JSON.stringify({ ...sbKeuze(), ...k })); } catch (e) {} }
const SB_GROND = {
  weg: [['asfalt', 'Gewoon asfalt', 0], ['ruw', 'Klinkers of kasseien', -0.5], ['glad', 'Vers glad asfalt', 0.3]],
  gravel: [['gemengd', 'Gemengd', 0], ['los', 'Los grind of zand', -0.3], ['asfalt', 'Veel asfalt', 0.3], ['tassen', 'Met tassen', 0.4]]
};
const ATM = 1.013;
function sbFiets() {
  const f = (SB.profiel && SB.profiel.fietsen) || [];
  const id = sbKeuze().fiets;
  return f.find((x) => x.id === id) || f[0] || null;
}
function sbNat() { const k = sbKeuze(); return k.natHand != null ? k.natHand : !!(SB.weer && SB.weer.nat); }
function sbGrond(f) { const k = sbKeuze(), lijst = SB_GROND[f.type]; return lijst.find((g) => g[0] === k['grond_' + f.type]) || lijst[0]; }

function sbReken(f) {
  if (!BT_LIB || !f || !SB.profiel.gewicht) return null;
  const a = BT_LIB.bandenAdvies(BT_LIB.leesInvoer({ bandtype: f.type, gewicht: SB.profiel.gewicht, breedte: f.breedte, tubeless: f.tubeless ? 'tubeless' : 'binnenband' }));
  if (!a) return null;
  const nat = sbNat(), grond = sbGrond(f);
  const corr = (nat ? -0.3 : 0) + grond[2];
  const min = f.type === 'gravel' ? 1.3 : 2.5, max = f.hookless ? BT_LIB.HOOKLESS_MAX : 99;
  const r1 = (x) => Math.round(x * 10) / 10;
  const klem = (x) => r1(Math.min(max, Math.max(min, x)));
  let voor = klem(a.voor + corr), achter = klem(a.achter + corr);
  // Geheugen: reed je eerder op deze fiets onder vergelijkbaar weer en gaf je
  // een oordeel, dan wint dat van de formule. Te hard of te zacht = 0,2 bar bij.
  const berekend = { voor, achter };
  const eerder = sbGeheugen(f, nat, grond[0], SB.weer ? SB.weer.temp : null);
  let geheugen = null;
  if (eerder) {
    const stap = eerder.oordeel === 'hard' ? -0.2 : eerder.oordeel === 'zacht' ? 0.2 : 0;
    voor = klem(eerder.voor + stap); achter = klem(eerder.achter + stap);
    geheugen = { ...eerder, stap, berekend };
  }
  // Kou: lucht krimpt. Pomp je binnen (20 graden) en rijd je in de kou, dan
  // zakt de druk. Gaslaw op absolute druk, met de laagste temperatuur van de
  // komende uren.
  let binnenV = null, binnenA = null, temp = SB.weer ? SB.weer.laagste : null;
  if (temp != null && temp < 15) {
    const f2 = (g) => r1(Math.min(max, (g + ATM) * 293.15 / (273.15 + temp) - ATM));
    if (f2(achter) - achter >= 0.1) { binnenV = f2(voor); binnenA = f2(achter); }
  }
  const redenen = [];
  if (nat) redenen.push('nat wegdek, 0,3 bar eraf voor grip');
  if (grond[2]) redenen.push(`${grond[1].toLowerCase()}, ${BT_LIB.nl(Math.abs(grond[2]))} bar ${grond[2] < 0 ? 'eraf' : 'erbij'}`);
  if (f.hookless && (a.achter + corr) > max) redenen.push('hookless velg, nooit boven 5,0 bar');
  return { voor, achter, binnenV, binnenA, temp, redenen, nat, grond, geheugen };
}

// ---- Schema in de app (09-10-2026) ----
// Wat er vandaag op je schema staat, met Michels uitleg uit TrainingPeaks.
// De klant traint gewoon in TrainingPeaks; dit is de uitleg en de context.
const SK = { dag: null, open: {} };
function skUren(u) { if (!u) return ''; const m = Math.round(u * 60); return m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' uur' : m + ' min'; }
function skMin(sec) { if (!sec) return ''; if (sec < 60) return sec + ' sec'; if (sec % 60) return String(Math.round(sec / 6) / 10).replace('.', ',') + ' min'; const m = sec / 60; return m >= 60 ? Math.floor(m / 60) + ' u' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; }
function skVlak(blokken) {
  const uit = [];
  const loop = (b, keer) => { for (let i = 0; i < keer; i++) b.forEach((x) => x.stappen ? loop(x.stappen, x.x || 1) : uit.push(x)); };
  loop(blokken || [], 1);
  return uit.filter((x) => x.s);
}
function skGrafiek(blokken) {
  const stappen = skVlak(blokken); if (!stappen.length) return '';
  const tot = stappen.reduce((t, x) => t + x.s, 0); let xpos = 0;
  const rects = stappen.map((x) => { const pct = Math.min(130, x.hi || x.lo || 50); const h = Math.max(6, Math.round(pct / 130 * 46)); const w = x.s / tot * 300; const kleur = pct >= 100 ? '#FF6B1A' : pct >= 85 ? 'rgba(255,107,26,.75)' : pct >= 70 ? 'rgba(255,107,26,.45)' : 'rgba(245,243,239,.22)'; const r = `<rect x="${xpos.toFixed(2)}" y="${48 - h}" width="${Math.max(0.6, w - 0.6).toFixed(2)}" height="${h}" rx="1" fill="${kleur}"/>`; xpos += w; return r; }).join('');
  return `<svg class="sk-graf" viewBox="0 0 300 48" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`;
}
function skDoel(x, meet) {
  if (x.lo == null && x.hi == null) return '';
  const sa = D && D.schema && D.schema.analyse;
  const ftp = meet === 'vermogen' ? (sa && sa.meet === 'vermogen' ? sa.waarde : (D && D.analyse && D.analyse.meet !== 'hartslag' ? Number(String(D.analyse.ftp).replace(/[^0-9]/g, '')) : 0)) : 0;
  const pct = x.hi ? x.lo + '-' + x.hi + '%' : x.lo + '%';
  return ftp ? `${pct} (${Math.round(ftp * x.lo / 100)}${x.hi ? '-' + Math.round(ftp * x.hi / 100) : ''} W)` : pct;
}

// Core rond het schema (09-10-2026): op welke dagen van deze schemaweek je je

const SK_RUSTIG = /duur|herstel|z2|cadans|voorbereiding|recovery/i;

function coreDagen(s, aantal) {
  if (!s || s.status !== 'loopt' || !aantal) return [];
  const d = s.weekDagen;
  const score = d.map((x, i) => {
    let p = !x.trainingen.length ? 3 : skZwaar(x.trainingen) ? 0 : 2;
    if (d[i + 1] && skZwaar(d[i + 1].trainingen)) p -= 1.5;
    return { i, p };
  });
  const gekozen = [];
  for (const kandidaat of score.slice().sort((a, b) => b.p - a.p || a.i - b.i)) {
    if (gekozen.length >= aantal) break;
    if (kandidaat.p <= 0 && gekozen.length >= 2) break;
    if (gekozen.some((g) => Math.abs(g - kandidaat.i) === 1) && score.filter((x) => !gekozen.includes(x.i) && !gekozen.some((g) => Math.abs(g - x.i) === 1) && x.p > 0).length) continue;

document.addEventListener('click', (e) => {

  if (actie === 'bekijk') { BEKIJK = k.dataset.w; try { localStorage.setItem('mkcBekijk', BEKIJK); } catch {} CC.berichten = null; teken(); }

// Proefweek via dezelfde route als /core-gratis/ (tag core-gratis, welkomstmail,
// journey), maar met het mailadres van je account. Daarna meteen de Core-app open.
async function startCore(knop) {
  knop.disabled = true; knop.textContent = 'Even klaarzetten...';
  try {
    const j = await (await fetch('/api/keuzehulp-inschrijving', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ route: 'core-gratis', email: D.email, naam: D.naam || '' }) })).json();
    if (j.ok && j.link) { location.href = j.link; return; }
    alert(j.fout || 'Dat lukte niet. Probeer het zo nog eens.');
  } catch (e) { alert('Verbinding mislukt. Probeer het zo nog eens.'); }
  knop.disabled = false; knop.textContent = 'Start je gratis week';
}
async function wordLid(knop) {
  const vink = document.getElementById('lidAkkoord');
  if (vink && !vink.checked) { const l = vink.closest('.lid-akkoord'); l.classList.add('fout'); l.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => l.classList.remove('fout'), 2500); return; }
  knop.disabled = true; const oud = knop.textContent; knop.textContent = 'Even naar iDEAL...';
  try {
    const r = await fetch('/api/lid?actie=start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken(), naam: D && D.naam, plan: knop.dataset.plan === 'jaar' ? 'jaar' : 'maand', akkoord: !vink || vink.checked }) });
    const j = await r.json();
    if (j.ok && j.url) { location.href = j.url; return; }
    if (j.ok && j.alLid) { return laadOverzicht(); }
    alert(j.fout || 'Dat lukte niet. Probeer het zo nog eens.');
  } catch { alert('Verbinding mislukt. Probeer het zo nog eens.'); }
  knop.disabled = false; knop.textContent = oud;
}
async function zegOp(knop) {
  if (!confirm('Weet je het zeker? Je kunt alles blijven gebruiken tot het einde van de maand waarvoor je betaald hebt.')) return;
  knop.disabled = true;
  try {
    const r = await fetch('/api/lid?actie=opzeggen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken() }) });
    const j = await r.json();
    if (!j.ok) alert(j.fout || 'Opzeggen lukte niet.');
  } catch { alert('Verbinding mislukt.'); }
  laadOverzicht();
}

// Rekent met /lib/kleding.js (Michels eigen indeling uit zondagmail 5), met het
// weer tijdens je rit (vertrek + duur, per uur van Open-Meteo).
let KL_LIB = null;
async function klLaadLib() { if (!KL_LIB) { try { KL_LIB = await import('/lib/kleding.js'); } catch (e) {} } }
const KL_DUUR = [[1, '1 uur'], [1.5, '1,5 uur'], [2, '2 uur'], [3, '3 uur'], [4, '4 uur'], [5, '5 uur of meer']];
function klKeuze() { const k = sbKeuze(); return { over: Number(k.klOver || 0), duur: Number(k.klDuur || 2), hard: !!k.klHard }; }
// Het weer tijdens je rit uit de uurlijst.
function klRitWeer(over, duur) {
  const w = SB.weer; if (!w) return null;
  const uren = w.uren || [];
  const stuk = uren.slice(Math.floor(over), Math.ceil(over + duur) + 1);
  if (!stuk.length) return { temp: w.laagste, start: w.temp, wind: w.wind, regen: w.nat || w.regenStraks };
  return { temp: Math.min(...stuk.map((u) => u.temp)), start: stuk[0].temp, wind: Math.max(...stuk.map((u) => u.wind)), regen: (over < 1 && w.nat) || stuk.reduce((a, u) => a + u.regen, 0) >= 0.5 };
}
function klReken() {
  if (!KL_LIB || !SB.weer) return null;
  const k = klKeuze(), rw = klRitWeer(k.over, k.duur);
  if (!rw) return null;
  const a = KL_LIB.kledingAdvies({ temp: rw.temp, start: rw.start, wind: rw.wind, regen: rw.regen, intensiteit: k.hard ? 'hard' : 'rustig', kouType: (SB.profiel && SB.profiel.kouType) || 'normaal', bijstel: KL_LIB.kledingBijstel(SB.ritten || []), duurUur: k.duur });
  return a ? { ...a, rw } : null;
}

      <div><label for="klDuur">Hoe lang</label><select id="klDuur">${KL_DUUR.map(([v, t]) => `<option value="${v}" ${k.duur === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>

    ${uit}`;
}

function meldingenHtml(d) {

  return l.map((m) => `<div class="meld" data-mid="${esc(m.id)}"><div class="meld-ic">${BEL_SVG}</div><div class="meld-in"><b>${esc(m.titel)}</b>${m.tekst ? `<p>${esc(m.tekst)}</p>` : ''}${m.link ? `<a class="knop" href="${esc(m.link)}" data-meldopen="${esc(m.id)}">${m.soort === 'core' ? 'Start je sessie' : 'Bekijk'}</a>` : ''}</div><button class="meld-x" data-meldweg="${esc(m.id)}" aria-label="Weg">&times;</button></div>`).join('');
}
async function meldWeg(id) {
  try { const j = await (await fetch(API + '?actie=melding', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken(), id }) })).json(); if (j.ok && D) D.meldingen = j.meldingen; } catch (e) {}
}
document.addEventListener('click', (e) => {
  const w = e.target.closest('[data-meldweg]');
  if (w) { const kaart = w.closest('.meld'); if (kaart) kaart.remove(); if (D) D.meldingen = (D.meldingen || []).filter((m) => m.id !== w.dataset.meldweg); meldWeg(w.dataset.meldweg); return; }
  const o = e.target.closest('[data-meldopen]');
  if (o) meldWeg(o.dataset.meldopen);
});

// Pushberichten "standaard aan": telefoons vragen altijd eerst toestemming,
// dus we vragen het meteen en duidelijk. Na toestemming staat alles aan
// (ochtendbericht en Core-herinnering), uitzetten kan onderaan. Gaf iemand al
// toestemming maar kent de server dit toestel nog niet, dan koppelen we stil.
function pushWeg() { try { return localStorage.getItem('mkcPushVraagWeg') === '1'; } catch (e) { return false; } }
function meldVraagHtml() {
  if (!pushKan() || !PUSH.key || !PUSH.inst || PUSH.inst.aan || pushWeg()) return '';
  if (typeof Notification !== 'undefined' && Notification.permission === 'denied') return '';
  return `<div class="meldvraag"><b>Mis niets: zet meldingen aan</b><p>Je Core-herinnering, ${zicht() && isLid(zicht()) ? 'je ochtendbericht met bandenspanning en kleding, ' : ''}en wat er verder voor je klaarstaat. Uitzetten kan altijd.</p>
    <div class="rij"><button type="button" class="knop" data-push="aan" ${PUSH.bezig ? 'disabled' : ''}>${PUSH.bezig ? 'Even toestemming vragen...' : 'Zet meldingen aan'}</button><button type="button" class="sb-link" data-push="vraagweg">Nu niet</button></div>
    ${PUSH.melding && !PUSH.inst.aan ? `<p class="klein" style="margin:10px 0 0">${esc(PUSH.melding)}</p>` : ''}</div>`;
}
function meldInstHtml() {
  if (!PUSH.inst || !PUSH.inst.aan) return '';
  const i = PUSH.inst;
  return `<div class="meldinst"><b>Meldingen staan aan</b> op dit toestel.
    <label><input type="checkbox" data-pushsoort="core" ${i.core ? 'checked' : ''}> Core-herinnering op maandag</label>
    ${zicht() && isLid(zicht()) ? `<label><input type="checkbox" data-pushsoort="ochtend" ${i.ochtend ? 'checked' : ''}> Ochtendbericht (weer, banden en kleding)</label>` : ''}
    <p class="klein" style="margin-top:8px">Staat iets uit, dan zie je het gewoon hier in de app zodra je hem opent.</p></div>`;
}
function meldTeken() {
  const a = document.getElementById('meldvraag'); if (a) a.innerHTML = meldVraagHtml();
  const sl = document.getElementById('startlijst'); if (sl && D) sl.innerHTML = startlijstHtml(zicht());
  const b = document.getElementById('meldinst'); if (b) b.innerHTML = meldInstHtml();
}
document.addEventListener('change', async (e) => {
  const c = e.target.closest('[data-pushsoort]'); if (!c) return;
  await pushOpslaan({ [c.dataset.pushsoort]: c.checked });
  meldTeken();
});
async function pushStilKoppelen() {
  try {
    if (!pushKan() || !PUSH.key || !PUSH.inst || PUSH.inst.aan || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64naarBytes(PUSH.key) });
    await pushOpslaan({ sub: sub.toJSON() });
  } catch (e) {}
}

// ---- Ochtendbericht ----
let PUSH = { geladen: false, key: null, inst: null, bezig: false, melding: '' };
const DAGNAMEN = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const PUSH_TIJDEN = ['06:00', '06:30', '07:00', '07:30', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00', '12:00'];
function pushKan() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function iosZonderApp() { return /iPhone|iPad|iPod/.test(navigator.userAgent) && !isApp(); }
async function pushLaad() {
  if (PUSH.geladen) return; PUSH.geladen = true;
  try { const j = await (await fetch(`${API}?actie=push&t=${encodeURIComponent(leesToken())}`)).json(); if (j.ok) { PUSH.key = j.publicKey; PUSH.inst = j.instelling; } } catch (e) {}
  await pushStilKoppelen();
  sbTeken(); meldTeken();
}
function pushHtml() {
  const i = PUSH.inst || { aan: false, tijd: '07:00', dagen: [0, 1, 2, 3, 4, 5, 6] };
  let inhoud;
  if (iosZonderApp()) inhoud = '<p class="klein">Zet de app eerst op je beginscherm (deel-knop, Zet op beginscherm). Daarna kun je hier je ochtendbericht aanzetten.</p>';
  else if (!pushKan()) inhoud = '<p class="klein">Je browser ondersteunt geen meldingen. Open de app vanaf je beginscherm of in Chrome.</p>';
  else if (!PUSH.key) inhoud = '<p class="klein">Het ochtendbericht gaat binnenkort open.</p>';
  else inhoud = `
    <div class="kl-plan"><div><label for="pushTijd">Tijd</label><select id="pushTijd">${PUSH_TIJDEN.map((t) => `<option ${i.tijd === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label>Dagen</label><div class="push-dagen">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<button type="button" data-push="dag" data-d="${d}" class="${i.dagen.includes(d) ? 'aan' : ''}">${DAGNAMEN[d]}</button>`).join('')}</div></div></div>
    ${i.aan ? `<div class="push-rij"><span class="push-aan">&#10003; Staat aan</span><button type="button" class="opv-k" data-push="test" ${PUSH.bezig ? 'disabled' : ''}>Stuur nu een test</button><button type="button" class="sb-link" data-push="uit">Uitzetten</button></div>`
      : `<button type="button" class="knop" data-push="aan" ${PUSH.bezig ? 'disabled' : ''}>${PUSH.bezig ? 'Even toestemming vragen...' : 'Zet mijn ochtendbericht aan'}</button>`}
    ${PUSH.melding ? `<p class="klein">${esc(PUSH.melding)}</p>` : ''}`;
  return `<div class="push"><b>Ochtendbericht</b><p class="klein" style="margin-top:2px">Elke rijdag een melding met het weer, je bandenspanning en wat je aantrekt.</p>${inhoud}</div>`;
}
function b64naarBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map((c) => c.charCodeAt(0))); }
async function pushOpslaan(extra) {
  const i = PUSH.inst || {};
  const j = await (await fetch(`${API}?actie=push`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken(), tijd: i.tijd, dagen: i.dagen, ...extra }) })).json();
  if (j.ok) PUSH.inst = j.instelling; else PUSH.melding = j.fout || 'Opslaan lukte niet.';
  return j.ok;
}
document.addEventListener('click', async (e) => {
  const k = e.target.closest('[data-push]'); if (!k) return;
  const a = k.dataset.push;
  PUSH.inst = PUSH.inst || { aan: false, tijd: '07:00', dagen: [0, 1, 2, 3, 4, 5, 6] };
  PUSH.melding = '';
  if (a === 'dag') {
    const d = Number(k.dataset.d), l = PUSH.inst.dagen;
    PUSH.inst.dagen = l.includes(d) ? l.filter((x) => x !== d) : l.concat(d);
    if (PUSH.inst.aan) await pushOpslaan({}); return sbTeken();
  }
  if (a === 'vraagweg') { try { localStorage.setItem('mkcPushVraagWeg', '1'); } catch (er) {} return meldTeken(); }
  if (a === 'aan') {
    PUSH.bezig = true; sbTeken(); meldTeken();
    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      const toestemming = await Notification.requestPermission();
      if (toestemming !== 'granted') { PUSH.melding = 'Je gaf geen toestemming voor meldingen. Dat kun je later aanpassen in de instellingen van je telefoon.'; }
      else {
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64naarBytes(PUSH.key) });
        if (await pushOpslaan({ sub: sub.toJSON() })) PUSH.melding = 'Gelukt. Tik op "Stuur nu een test" om te zien hoe hij eruitziet.';
      }
    } catch (er) { PUSH.melding = 'Aanzetten lukte niet op dit toestel.'; }
    PUSH.bezig = false; sbTeken(); return meldTeken();
  }
  if (a === 'uit') { await pushOpslaan({ uit: true }); sbTeken(); return meldTeken(); }
  if (a === 'test') {
    PUSH.bezig = true; sbTeken();
    try { const j = await (await fetch(`${API}?actie=pushtest`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: leesToken() }) })).json(); PUSH.melding = j.ok ? 'Verstuurd. Je melding komt zo binnen.' : (j.fout || 'Versturen lukte niet.'); }
    catch (er) { PUSH.melding = 'Verbinding mislukt.'; }
    PUSH.bezig = false; return sbTeken();
  }
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'pushTijd') return;
  PUSH.inst = PUSH.inst || { aan: false, tijd: '07:00', dagen: [0, 1, 2, 3, 4, 5, 6] };
  PUSH.inst.tijd = e.target.value;
  if (PUSH.inst.aan) { await pushOpslaan({}); sbTeken(); }
});

async function laadOverzicht() {
  const t = leesToken();
  if (!t) return toonLogin();
  zetLoginInApp(t);
  try {
    const r = await fetch(API + '?actie=overzicht&t=' + encodeURIComponent(t));
    const j = await r.json();
    if (!j.ok) { wisToken(); return toonLogin(j.fout, 'fout'); }
    D = j; teken(); naarLidAnker(); pushLaad();
    if (D.beheer && BEKIJK === 'zelf' && SIM.schema && SIM.schema.includes('|')) simSchemaLaad(SIM.schema).then(teken);
    if (D.beheer && !D.schema) simSchemaLaad('opbouw-12-w|18').then(() => { if (BEKIJK === 'alles') teken(); });
    if (D.beheer && OPV.meldingen === null) opvLaad();
  } catch { $('#app').innerHTML = '<div class="laden">Verbinding mislukt. Probeer het zo nog eens.</div>'; }
}

async function start() {
  const p = new URLSearchParams(location.search);
  // Login uit de mail-knop of de app-start (?t=), of doorklik vanuit de Core-app (?ct=).
  if (p.get('t')) bewaarToken(p.get('t'));
  if (p.get('ct')) {
    try {
      const r = await fetch(API + '?actie=vancore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ct: p.get('ct') }) });
      const j = await r.json(); if (j.ok && j.t) bewaarToken(j.t);
    } catch (e) {}
  }
  if (p.get('lid') === 'terug') {
    $('#app').innerHTML = '<div class="laden">Bedankt! Je betaling wordt verwerkt...</div>';
    for (let i = 0; i < 8; i++) {
      await new Promise((r) => setTimeout(r, 1500));
      try { const s = await (await fetch('/api/lid?actie=status&t=' + encodeURIComponent(leesToken()))).json(); if (s.ok && s.lid && s.lid.status === 'actief') break; } catch (e) {}
    }
  }
  return laadOverzicht();
}
start();
</script>
