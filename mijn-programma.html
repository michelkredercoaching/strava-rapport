<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mijn Afvalprogramma | Michel Kreder Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --black:#0A0A0A; --offblack:#111; --surface:#161616; --surface2:#1c1c1c;
          --border:rgba(255,255,255,0.08); --white:#F5F3EF; --muted:rgba(245,243,239,0.62);
          --accent:#FF6B1A; --accent-dim:rgba(255,107,26,0.12); --groen:#3FB950; --rood:#F04438; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--black); color:var(--white);
         -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.6; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 70px; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(30px,6vw,44px); line-height:1; letter-spacing:0.01em; }
  h2 { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:0.02em; margin-bottom:14px; }
  .kop { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
         padding-bottom:18px; border-bottom:1px solid var(--border); margin-bottom:26px; }
  .wk { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); }
  .blok { margin-bottom:34px; }
  .kaart { background:var(--surface); border:1px solid var(--border); padding:22px; }
  .muted { color:var(--muted); }
  .klein { font-size:13px; }

  /* KPI */
  .kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
  .kpi div { background:var(--surface); border:1px solid var(--border); padding:16px 18px; }
  .kpi span { display:block; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .kpi b { font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; }
  .kpi i { font-style:normal; font-size:13px; margin-left:6px; }
  .kpi i.op { color:var(--groen); }

  /* Grafiek */
  .grafiek { display:flex; align-items:flex-end; gap:4px; height:80px; margin:18px 0 4px; }
  .grafiek i { flex:1; background:rgba(255,107,26,0.28); border-top:2px solid var(--accent); display:block; min-height:2px; }
  .grafiek i.leeg { background:rgba(255,255,255,0.04); border-top:2px dashed rgba(245,243,239,0.18); }
  .as { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }

  /* Check-in */
  .veld { margin-bottom:14px; }
  .veld label { display:block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  input[type=number], input[type=text], select, textarea {
    width:100%; background:var(--black); border:1px solid var(--border); padding:12px 14px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .keuze { display:flex; gap:2px; flex-wrap:wrap; }
  .keuze button { flex:1; min-width:96px; background:var(--black); border:1px solid var(--border); padding:12px 8px; cursor:pointer; font-size:14px; }
  .keuze button.aan { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); font-weight:600; }
  .knop { background:var(--accent); color:var(--black); border:none; font-weight:700; letter-spacing:0.07em;
          text-transform:uppercase; font-size:13px; padding:15px 28px; cursor:pointer; }
  .knop:hover { background:#fff; }
  .knop.leeg { background:transparent; border:1px solid var(--border); color:var(--white); }
  .knop:disabled { opacity:0.45; cursor:default; }
  .melding { font-size:13.5px; margin-top:10px; }
  .melding.goed { color:var(--groen); }
  .melding.fout { color:var(--rood); }
  .gedaan { background:var(--accent-dim); border:1px solid rgba(255,107,26,0.3); padding:16px 18px; }

  /* Dagen */
  .dagen { display:flex; gap:2px; overflow-x:auto; padding-bottom:4px; margin-bottom:2px; }
  .dagknop { flex:1; min-width:64px; background:var(--surface); border:1px solid var(--border);
             padding:11px 6px; text-align:center; cursor:pointer; }
  .dagknop.aan { border-color:var(--accent); background:var(--accent-dim); }
  .dagknop b { display:block; font-family:'Bebas Neue',sans-serif; font-size:17px; }
  .dagknop span { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
  .dagknop.aan span { color:var(--accent); }
  .dagkaart { background:var(--surface); border:1px solid var(--border); border-top:none; padding:22px; }
  .getallen { display:flex; gap:26px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .getallen div span { display:block; font-size:10px; letter-spacing:0.13em; text-transform:uppercase; color:var(--muted); }
  .getallen div b { font-family:'Bebas Neue',sans-serif; font-size:25px; }
  .moment { padding:11px 0; border-bottom:1px solid var(--border); font-size:14.5px; }
  .moment:last-of-type { border-bottom:none; }
  .moment b { font-weight:600; }
  .momentkop { display:flex; justify-content:space-between; gap:14px; align-items:baseline; }
  .momentkop span { color:var(--muted); white-space:nowrap; font-size:13.5px; }
  .kieslabel { display:block; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin:8px 0 3px; }
  .moment ol { margin:0; padding-left:19px; }
  .moment ol li { color:var(--muted); padding:2.5px 0; }
  .fiets { background:var(--black); border:1px solid rgba(255,107,26,0.3); padding:16px 18px; margin-top:16px; }
  .fiets h3 { font-size:12px; letter-spacing:0.13em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
  .fiets ul { margin:0 0 0 18px; }
  .fiets li { margin-bottom:5px; }
  .fiets .letop { margin-top:10px; font-size:13px; color:var(--muted); }

  /* Ruiltabel */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); }
  th { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  td:last-child, th:last-child { text-align:right; white-space:nowrap; }
  details summary { cursor:pointer; color:var(--accent); font-size:14px; padding:8px 0; }

  /* Berichten */
  .draad { display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .bericht { max-width:85%; padding:12px 16px; border-radius:10px; white-space:pre-wrap; font-size:14.5px; }
  .bericht.ik { background:var(--surface2); border:1px solid var(--border); align-self:flex-end; border-bottom-right-radius:2px; }
  .bericht.michel { background:var(--accent-dim); border:1px solid rgba(255,107,26,0.3); align-self:flex-start; border-bottom-left-radius:2px; }
  .bericht .meta { font-size:10.5px; color:var(--muted); margin-top:7px; }

  /* Intake */
  .stap { margin-bottom:26px; }
  .stap h2 small { display:block; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:400;
                   letter-spacing:0; text-transform:none; color:var(--muted); margin-top:5px; }
  .tweekolom { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .weekrij { display:grid; grid-template-columns:48px 1fr 92px; gap:8px; align-items:center; margin-bottom:6px; }
  .weekrij .dag { font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .vinkje { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; font-size:14px; color:var(--muted); }
  .vinkje input { margin-top:4px; }
  .laden { text-align:center; padding:70px 20px; color:var(--muted); }
  @media (max-width:620px) {
    .kpi { grid-template-columns:1fr; }
    .tweekolom { grid-template-columns:1fr; }
    .bericht { max-width:100%; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="laden">Je programma laden...</div></div>

<script>
const API = '/api/afvalprogramma';
const token = new URLSearchParams(location.search).get('t') || '';
let D = null;          // wat de server teruggeeft
let vragen = [];       // inschrijfkaart
let dagIndex = 0;
let keuzes = { gevoel:'goed', etenGelukt:'meestal' };

const veilig = t => String(t == null ? '' : t)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function start() {
  if (!token) return toon('<div class="laden">Deze link is niet compleet. Gebruik de link uit je welkomstmail.</div>');
  try {
    const [r1, r2] = await Promise.all([
      fetch(API + '?actie=plan&t=' + encodeURIComponent(token)),
      fetch(API + '?actie=vragen')
    ]);
    D = await r1.json();
    vragen = (await r2.json()).vragen || [];
  } catch (e) {
    return toon('<div class="laden">Het laden lukte niet. Probeer het zo nog eens.</div>');
  }
  if (!D.ok) return toon('<div class="laden">' + veilig(D.fout || 'Deze link werkt niet meer.') + '</div>');
  teken();
}

const toon = h => { document.getElementById('app').innerHTML = h; };

function teken() {
  if (D.intakeNodig) return tekenIntake();
  tekenDashboard();
}

// ===========================================================================
// INTAKE
// ===========================================================================
function tekenIntake() {
  const dagen = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const types = [['rust','Rustdag'],['herstel','Hersteltraining'],['duur','Duurtraining'],
                 ['interval','Intervaltraining'],['lang','Lange rit']];
  toon(`
    <div class="kop">
      <div><h1>Welkom${D.naam ? ', ' + veilig(D.naam.split(' ')[0]) : ''}</h1>
        <div class="wk">Vul dit eenmalig in, dan staat je plan klaar</div></div>
    </div>

    ${D.startDatum && D.week === 0 ? `
    <div class="blok"><div class="gedaan">
      <b>Je programma start op ${datum(D.startDatum)}.</b><br>Vul dit nu vast in, dan staat je plan klaar op de dag dat het begint. Tot die tijd hoef je niets aan je eten te veranderen.
    </div></div>` : ''}

    <div class="stap">
      <h2>Jij<small>Hier reken ik je energiebehoefte mee uit.</small></h2>
      <div class="kaart">
        <div class="tweekolom">
          <div class="veld"><label>Ik ben</label>
            <select id="geslacht"><option value="man">Man</option><option value="vrouw">Vrouw</option></select></div>
          <div class="veld"><label>Leeftijd</label><input type="number" id="leeftijd" min="18" max="90"></div>
          <div class="veld"><label>Lengte in cm</label><input type="number" id="lengte" min="130" max="220"></div>
          <div class="veld"><label>Gewicht in kg</label><input type="number" id="gewicht" step="0.1" min="40" max="200"></div>
          <div class="veld"><label>Streefgewicht in kg</label><input type="number" id="streefgewicht" step="0.1" min="40" max="200"></div>
          <div class="veld"><label>Je werk</label>
            <select id="werk">
              <option value="zittend">Vooral zittend</option>
              <option value="actief">Staand of lopend</option>
              <option value="zwaar">Fysiek zwaar</option>
            </select></div>
        </div>
        <div class="veld"><label>Je FTP in watt, als je die weet</label>
          <input type="number" id="ftp" min="60" max="500" placeholder="Laat leeg als je op hartslag rijdt">
        </div>
        <div class="veld"><label>Je buikomtrek in cm, als je een meetlint hebt</label>
          <input type="number" id="buikomtrek" step="0.5" min="50" max="200" placeholder="Mag je ook leeg laten">
          <p class="klein muted" style="margin-top:6px">Meet 's ochtends rond je navel, rechtop, ontspannen uitgeademd. Dit bepaalt je plan niet. Het is er voor de weken waarin de weegschaal stilstaat terwijl er wel degelijk iets gebeurt. Ik vraag hem opnieuw in week 4, 8 en 12.</p>
        </div>
      </div>
    </div>

    <div class="stap">
      <h2>Je week<small>Zoals je hem normaal rijdt. Precies hoeft niet, het gaat om de verhouding.</small></h2>
      <div class="kaart">
        ${dagen.map((d, i) => `
          <div class="weekrij">
            <span class="dag">${d.slice(0,2)}</span>
            <select id="type${i}">${types.map(([w,t]) => `<option value="${w}">${t}</option>`).join('')}</select>
            <input type="number" id="uren${i}" step="0.25" min="0" max="8" placeholder="uren">
          </div>`).join('')}
      </div>
    </div>

    <div class="stap">
      <h2>Hoe je nu traint<small>Hiermee kies ik welk schema bij je past.</small></h2>
      <div class="kaart">
        ${vragen.map(v => `
          <div class="veld">
            <label>${veilig(v.tekst)}</label>
            <select id="kaart_${v.id}">
              <option value="">Kies...</option>
              ${v.opties.map(o => `<option value="${veilig(o.waarde)}">${veilig(o.tekst)}</option>`).join('')}
            </select>
          </div>`).join('')}
      </div>
    </div>

    <div class="stap">
      <h2>Wat je eet<small>Hiermee kies ik welke maaltijden ik je voorleg. Niets aanvinken is prima.</small></h2>
      <div class="kaart">
        <label class="vinkje"><input type="checkbox" id="vegetarisch"> Ik eet geen vlees of vis</label>
        <label class="vinkje"><input type="checkbox" id="geenZuivel"> Ik eet geen zuivel</label>
        <label class="vinkje"><input type="checkbox" id="weinigTijd"> Ik heb doordeweeks weinig tijd om te koken</label>
      </div>
    </div>

    <div class="stap">
      <h2>Nog even dit</h2>
      <div class="kaart">
        <p class="klein muted" style="margin-bottom:14px">Dit programma is niet bedoeld bij onderstaande situaties. Vink aan wat op jou van toepassing is, dan nemen we contact op en krijg je je geld terug.</p>
        <label class="vinkje"><input type="checkbox" id="diabetes"> Ik heb diabetes</label>
        <label class="vinkje"><input type="checkbox" id="zwanger"> Ik ben zwanger of geef borstvoeding</label>
        <label class="vinkje"><input type="checkbox" id="eetstoornis"> Ik heb nu of eerder een eetstoornis gehad</label>
      </div>
    </div>

    <button class="knop" onclick="stuurIntake()">Mijn plan berekenen</button>
    <div class="melding" id="melding"></div>
  `);
}

async function stuurIntake() {
  const n = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
  const week = [];
  for (let i = 0; i < 7; i++) {
    week.push({ type: document.getElementById('type'+i).value,
                uren: n('uren'+i) || 0 });
  }
  const kaart = {};
  for (const v of vragen) kaart[v.id] = document.getElementById('kaart_' + v.id).value;

  const body = {
    t: token,
    geslacht: document.getElementById('geslacht').value,
    leeftijd: n('leeftijd'), lengte: n('lengte'),
    gewicht: n('gewicht'), streefgewicht: n('streefgewicht'),
    werk: document.getElementById('werk').value,
    ftp: n('ftp'),
    buikomtrek: n('buikomtrek'),
    vegetarisch: document.getElementById('vegetarisch').checked,
    geenZuivel: document.getElementById('geenZuivel').checked,
    weinigTijd: document.getElementById('weinigTijd').checked,
    diabetes: document.getElementById('diabetes').checked,
    zwanger: document.getElementById('zwanger').checked,
    eetstoornis: document.getElementById('eetstoornis').checked,
    week, kaart
  };
  const m = document.getElementById('melding');
  if (!body.leeftijd || !body.lengte || !body.gewicht || !body.streefgewicht) {
    m.textContent = 'Vul je leeftijd, lengte, gewicht en streefgewicht in.'; m.className = 'melding fout'; return;
  }
  if (Object.values(kaart).some(v => !v)) {
    m.textContent = 'Beantwoord alle vragen over hoe je nu traint.'; m.className = 'melding fout'; return;
  }
  m.textContent = 'Bezig...'; m.className = 'melding';
  const r = await fetch(API + '?actie=intake', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.geweigerd) { m.innerHTML = veilig(j.uitleg); m.className = 'melding fout'; return; }
  if (!j.ok) { m.textContent = j.fout || 'Er ging iets mis.'; m.className = 'melding fout'; return; }
  D = j; window.scrollTo(0, 0); teken();
}

// ===========================================================================
// DASHBOARD
// ===========================================================================
function tekenDashboard() {
  const p = D.plan;
  dagIndex = Math.min(dagIndex, (p?.week?.length || 1) - 1);
  const start = D.startgewicht, nu = D.huidigGewicht;
  const doel = D.metingen?.length ? null : null;

  toon(`
    <div class="kop">
      <div><h1>Hoi${D.naam ? ' ' + veilig(D.naam.split(' ')[0]) : ''}</h1>
        <div class="wk">${D.week === 0 ? 'Je start op ' + datum(D.startDatum) : 'Week ' + D.week + ' van ' + D.weken}</div></div>
    </div>

    <div class="blok">
      <div class="kpi">
        <div><span>Gewicht</span><b>${nu != null ? nu + ' kg' : '—'}</b>${
          D.verschil != null && D.verschil !== 0 ? `<i class="${D.verschil < 0 ? 'op' : ''}">${D.verschil > 0 ? '+' : ''}${D.verschil}</i>` : ''}</div>
        <div><span>Gemiddeld per dag</span><b>${p ? p.gemiddeld : '—'}</b></div>
        <div><span>Eiwit per dag</span><b>${p ? p.eiwit + ' g' : '—'}</b></div>
      </div>
      ${omtrekRegel()}
      ${grafiek()}
      ${extraWeging()}
    </div>

    ${checkinBlok()}

    ${p ? `
    <div class="blok">
      <h2>Wat je eet deze week</h2>
      <div class="dagen">
        ${p.week.map((d, i) => `
          <div class="dagknop ${i === dagIndex ? 'aan' : ''}" onclick="kiesDag(${i})">
            <b>${d.dag}</b><span>${d.type === 'rust' ? 'rust' : d.uren + 'u'}</span>
          </div>`).join('')}
      </div>
      ${dagKaart(p.week[dagIndex])}
      ${ruilen()}
    </div>
    ${gewoonteBlok()}
    ${ruilTipBlok()}` : ''}

    ${berichtenBlok()}

    <p class="klein muted" style="margin-top:34px">Deze pagina is van jou en blijft twaalf weken staan. Vragen over je training gaan via TrainingPeaks, vragen over je voeding hier.</p>
  `);
}

function datum(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
}

function grafiek() {
  const m = D.metingen || [];
  if (m.length < 2) return '<p class="klein muted" style="margin-top:14px">Zodra je twee keer gewogen hebt, zie je hier je verloop.</p>';
  const waarden = m.map(x => x.gewicht);
  const max = Math.max(...waarden), min = Math.min(...waarden);
  const bereik = Math.max(0.5, max - min);
  const balken = [];
  for (let w = 0; w <= D.weken; w++) {
    const punt = m.find(x => x.week === w);
    balken.push(punt
      ? `<i style="height:${20 + ((punt.gewicht - min) / bereik) * 75}%" title="week ${w}: ${punt.gewicht} kg"></i>`
      : `<i class="leeg" style="height:14%"></i>`);
  }
  return `<div class="grafiek">${balken.join('')}</div>
          <div class="as"><span>start</span><span>nu</span><span>week ${D.weken}</span></div>`;
}

// Vaker wegen mag, maar we moedigen het niet aan. Eén keer per week is genoeg,
// en voor sommige mensen is dagelijks op de weegschaal staan geen goed idee.
function extraWeging() {
  if (D.week < 1 || D.week > D.weken) return '';
  const n = D.wegingenDezeWeek || 0;
  return `
    <details style="margin-top:16px">
      <summary>Vaker wegen? Dat mag, het maakt je lijn rustiger</summary>
      <div class="kaart" style="margin-top:10px">
        <p class="klein muted" style="margin-bottom:14px">Eén keer per week is genoeg. Weeg je vaker, dan reken ik met het gemiddelde van je week en heeft één ochtend met een kilo verschil geen invloed meer. Vind je dagelijks wegen niet prettig, sla dit dan gewoon over.</p>
        <div class="veld" style="margin-bottom:10px">
          <label>Extra weging${n > 1 ? ' (deze week al ' + n + ' keer)' : ''}</label>
          <input type="number" id="extra_gewicht" step="0.1" min="40" max="200" placeholder="kg">
        </div>
        <button class="knop leeg" onclick="stuurWeging()">Toevoegen</button>
        <div class="melding" id="melding_weging"></div>
      </div>
    </details>`;
}

async function stuurWeging() {
  const m = document.getElementById('melding_weging');
  const gewicht = parseFloat(document.getElementById('extra_gewicht').value);
  if (isNaN(gewicht)) { m.textContent = 'Vul je gewicht in.'; m.className = 'melding fout'; return; }
  m.textContent = 'Bezig...'; m.className = 'melding';
  const r = await fetch(API + '?actie=checkin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: token, gewicht, alleenGewicht: true }) });
  const j = await r.json();
  if (!j.ok) { m.textContent = j.fout || 'Er ging iets mis.'; m.className = 'melding fout'; return; }
  D = j; teken();
}

function checkinBlok() {
  if (D.week === 0) {
    return `<div class="blok"><div class="gedaan">
      <b>Je plan staat klaar.</b><br>Vanaf ${datum(D.startDatum)} vul je hier elke week je gewicht in. Tot die tijd hoef je niets te veranderen.
    </div></div>`;
  }
  if (D.ingevuldDezeWeek) {
    return `<div class="blok"><div class="gedaan">
      <b>Je check-in van deze week staat erin.</b>${D.laatsteBijsturing ? '<br>' + veilig(D.laatsteBijsturing) : ''}
    </div></div>`;
  }
  return `
    <div class="blok">
      <h2>Je check-in van week ${D.week}</h2>
      <div class="kaart">
        <div class="veld"><label>Je gewicht vanochtend, nuchter</label>
          <input type="number" id="gewicht_in" step="0.1" min="40" max="200" placeholder="kg"></div>
        ${D.omtrekGevraagd ? `
        <div class="veld"><label>Je buikomtrek in cm</label>
          <input type="number" id="omtrek_in" step="0.5" min="50" max="200" placeholder="Mag je ook leeg laten">
          <p class="klein muted" style="margin-top:6px">Rond je navel, rechtop, ontspannen uitgeademd. Ik vraag hem alleen in week 1, 4, 8 en 12.</p>
        </div>` : ''}
        <div class="veld"><label>Hoe voelden je trainingen?</label>
          <div class="keuze" id="k_gevoel">
            ${[['goed','Goed'],['wisselend','Wisselend'],['slecht','Zwaar en leeg']].map(([w,t]) =>
              `<button type="button" class="${keuzes.gevoel===w?'aan':''}" onclick="zetKeuze('gevoel','${w}')">${t}</button>`).join('')}
          </div></div>
        <div class="veld"><label>Lukte het eten?</label>
          <div class="keuze" id="k_eten">
            ${[['ja','Ja'],['meestal','Meestal'],['nee','Niet echt']].map(([w,t]) =>
              `<button type="button" class="${keuzes.etenGelukt===w?'aan':''}" onclick="zetKeuze('etenGelukt','${w}')">${t}</button>`).join('')}
          </div></div>
        <button class="knop" onclick="stuurCheckin()">Opslaan</button>
        <div class="melding" id="melding_checkin"></div>
      </div>
    </div>`;
}

function zetKeuze(veld, waarde) {
  keuzes[veld] = waarde;
  const vak = document.getElementById(veld === 'gevoel' ? 'k_gevoel' : 'k_eten');
  [...vak.children].forEach(b => b.classList.toggle('aan', b.textContent ===
    ({goed:'Goed',wisselend:'Wisselend',slecht:'Zwaar en leeg',ja:'Ja',meestal:'Meestal',nee:'Niet echt'})[waarde]));
}

async function stuurCheckin() {
  const m = document.getElementById('melding_checkin');
  const gewicht = parseFloat(document.getElementById('gewicht_in').value);
  if (isNaN(gewicht)) { m.textContent = 'Vul je gewicht in.'; m.className = 'melding fout'; return; }
  m.textContent = 'Bezig...'; m.className = 'melding';
  const r = await fetch(API + '?actie=checkin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: token, gewicht, gevoel: keuzes.gevoel, etenGelukt: keuzes.etenGelukt,
      buikomtrek: parseFloat((document.getElementById('omtrek_in') || {}).value) || undefined }) });
  const j = await r.json();
  if (!j.ok) { m.textContent = j.fout || 'Er ging iets mis.'; m.className = 'melding fout'; return; }
  D = j; window.scrollTo(0, 0); teken();
}

function kiesDag(i) { dagIndex = i; tekenDashboard(); }

function dagKaart(d) {
  if (!d) return '';
  const p = d.porties;
  return `
    <div class="dagkaart">
      <div class="getallen">
        <div><span>${veilig(d.naam)}</span><b>${d.kcal} kcal</b></div>
        <div><span>koolhydraten</span><b>${d.koolhydraten} g</b></div>
        <div><span>eiwit</span><b>${d.eiwit} g</b></div>
        <div><span>vet minimaal</span><b>${d.vet} g</b></div>
      </div>
      ${d.isKwaliteitsdag ? '<p class="klein" style="color:var(--accent);margin-bottom:14px">Kwaliteitsdag. Hier zit geen tekort in, want vandaag moet je kunnen trainen.</p>' : ''}
      ${p.ritKh ? `<p class="klein muted" style="margin-bottom:12px">Van je ${d.koolhydraten} gram koolhydraten eet je er ${p.ritKh} op de fiets. De rest, ${p.khThuis} gram, verdeel je zo:</p>` : ''}
      ${p.momenten.map(m => `
        <div class="moment">
          <div class="momentkop"><b>${veilig(m.moment)}</b>
            <span>${m.kcal} kcal &middot; ${String(m.kh).replace('.', ',')} blokken</span></div>
          ${m.kies && m.kies.length ? `
            <span class="kieslabel">Kies er &eacute;&eacute;n</span>
            <ol>${m.kies.map(k => `<li>${veilig(k)}</li>`).join('')}</ol>` : ''}
        </div>`).join('')}
      ${d.fiets ? `
        <div class="fiets">
          <h3>Op de fiets: ${d.fiets.totaal} gram koolhydraten, ${d.fiets.perUur} per uur</h3>
          ${d.fiets.manieren.map(w => `<p><b>${veilig(w.naam)}:</b> ${veilig(w.onderdelen.join(' + '))}</p>`).join('')}
          ${d.fiets.let_op ? `<p class="letop">${veilig(d.fiets.let_op)}</p>` : ''}
          ${d.fiets.voor ? `
            <h3 style="margin-top:16px">Voor de rit</h3>
            <p><span class="muted">${veilig(d.fiets.voor.wanneer)}:</span> ${veilig(d.fiets.voor.koolhydraten)} koolhydraten en ${veilig(d.fiets.voor.eiwit)} eiwit.</p>
            <p class="klein muted">Bijvoorbeeld: ${veilig(d.fiets.voor.voorbeelden[0])}.</p>` : ''}
          ${d.fiets.na ? `
            <h3 style="margin-top:16px">Na de rit</h3>
            <p><span class="muted">${veilig(d.fiets.na.wanneer)}:</span> ${veilig(d.fiets.na.eiwit)} eiwit en ${veilig(d.fiets.na.koolhydraten)} koolhydraten.</p>
            <p class="klein muted">Bijvoorbeeld: ${veilig(d.fiets.na.voorbeelden[0])}.</p>
            <p class="klein" style="color:var(--accent);margin-top:6px">${veilig(d.fiets.na.waarom)}</p>` : ''}
          <p class="klein muted" style="margin-top:12px">Wat je voor en na de rit eet zit al in de momenten hierboven. Alleen wat je &oacute;p de fiets eet staat apart.</p>
        </div>` : ''}
      ${recepten(d)}
    </div>`;
}

// Recepten zijn inspiratie, geen voorschrift. De hoeveelheden zijn al
// omgerekend naar de blokken van dit moment, dus ze passen in het plan.
function recepten(d) {
  const r = d.recepten || {};
  const namen = { ontbijt:'Ontbijt', rond_training:'Rond je training',
                  lunch:'Lunch', avond:'Avondeten', tussendoor:'Tussendoor' };
  const blokken = Object.entries(r).filter(([, lijst]) => lijst && lijst.length);
  if (!blokken.length) return '';
  return `
    <details style="margin-top:16px">
      <summary>Ideeën voor ${veilig(d.naam.toLowerCase())}, op jouw hoeveelheden</summary>
      <div style="margin-top:10px">
        ${blokken.map(([code, lijst]) => `
          <h2 style="font-size:17px;margin:18px 0 8px">${namen[code] || code}</h2>
          ${lijst.map(rec => `
            <div class="kaart" style="margin-bottom:2px">
              <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
                <b>${veilig(rec.naam)}</b><span class="klein muted">${veilig(rec.tijd)}</span>
              </div>
              <p class="klein muted" style="margin:6px 0 12px">${veilig(rec.waarvoor)}</p>
              <table style="margin-bottom:12px">
                ${rec.ingredienten.map(i => `<tr><td>${veilig(i.naam)}</td>
                  <td style="text-align:right;white-space:nowrap">${i.hoeveelheid} ${veilig(i.eenheid)}</td></tr>`).join('')}
              </table>
              <ol class="klein muted" style="margin:0 0 10px 18px">
                ${rec.stappen.map(s => `<li>${veilig(s)}</li>`).join('')}
              </ol>
              ${rec.tip ? `<p class="klein" style="color:var(--accent)">${veilig(rec.tip)}</p>` : ''}
              ${rec.verdelen ? '<p class="klein muted" style="margin-top:8px">Dit is één portie. Vandaag heb je op dit moment meer nodig, dus eet er iets bij of verdeel het over twee momenten.</p>' : ''}
            </div>`).join('')}
        `).join('')}
        <p class="klein muted" style="margin-top:14px">De hoeveelheden zijn al omgerekend naar jouw plan voor deze dag. Wijk je af, ruil dan binnen dezelfde kolom van de ruiltabel.</p>
      </div>
    </details>`;
}

// Eén gedragsregel per week. De rekensom klopt wel, mensen vallen om op de
// avond, en een lijst van twaalf regels tegelijk leest niemand.
function gewoonteBlok() {
  const g = D.gewoonte;
  if (!g) return '';
  return `
    <div class="blok">
      <h2>Deze week let je hierop</h2>
      <div class="kaart">
        <p class="klein" style="color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px">${g.nummer} van ${g.van}</p>
        <p style="font-size:17px;font-weight:600;margin-bottom:8px">${veilig(g.kop)}</p>
        <p>${veilig(g.tekst)}</p>
      </div>
    </div>`;
}

// De buikomtrek stuurt het plan niet bij. Hij staat er voor de weken waarin
// de weegschaal stilstaat terwijl er wel degelijk iets gebeurt.
function omtrekRegel() {
  const o = D.omtrek;
  if (!o) return '';
  if (o.laatste == null) {
    return `<p class="klein muted" style="margin-top:12px">Buikomtrek bij de start: ${o.start} cm. Ik vraag hem opnieuw in week 4, 8 en 12.</p>`;
  }
  const v = o.verschil;
  const tekst = v < 0 ? `${Math.abs(v).toString().replace('.', ',')} cm eraf sinds de start`
    : v > 0 ? `${v.toString().replace('.', ',')} cm erbij sinds de start`
    : 'gelijk gebleven sinds de start';
  return `<p class="klein" style="margin-top:12px;color:${v < 0 ? 'var(--accent)' : 'var(--muted)'}">Buikomtrek: ${o.laatste} cm, ${tekst}.</p>`;
}

function ruilTipBlok() {
  const t = D.ruilTip;
  if (!t) return '';
  const label = { eiwit:'Meer eiwit, zelfde calorieën', verzadiging:'Zelfde calorieën, langer vol',
                  kcal:'Dit scheelt echt calorieën', timing:'Beter op dit moment' };
  return `
    <div class="blok">
      <h2>Slimme ruil van deze week</h2>
      <div class="kaart">
        <p style="font-size:17px;margin-bottom:10px"><span class="muted">${veilig(t.van)}</span>
          <span style="color:var(--accent)"> &rarr; </span><b>${veilig(t.naar)}</b></p>
        <p class="klein" style="color:var(--accent);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px">${veilig(label[t.soort] || '')}</p>
        <p>${veilig(t.winst)}</p>
        <p class="klein muted" style="margin-top:8px">${veilig(t.wanneer)}</p>
      </div>
    </div>`;
}

function ruilen() {
  const r = D.ruilen;
  if (!r) return '';
  const tabel = (rijen, eenheid) => `
    <table><thead><tr><th>Product</th><th>Portie</th><th>${eenheid}</th></tr></thead><tbody>
    ${rijen.map(x => `<tr><td>${veilig(x.naam)}</td><td class="muted">${veilig(x.portie)}</td><td>${x.blokken}</td></tr>`).join('')}
    </tbody></table>`;
  return `
    <details style="margin-top:16px">
      <summary>Wat is een koolhydraatblok, en wat mag ik ruilen?</summary>
      <div class="kaart" style="margin-top:10px">
        <p class="klein muted" style="margin-bottom:16px">Eén koolhydraatblok is ${r.blok.koolhydraat} gram koolhydraten, één eiwitportie ${r.blok.eiwit} gram eiwit. Alles in dezelfde kolom mag je onderling ruilen. Zo hoef je niets af te wegen wat je niet wil afwegen.</p>
        <h2 style="font-size:18px;margin:18px 0 8px">Koolhydraten</h2>
        ${tabel(r.kh, 'blokken')}
        <h2 style="font-size:18px;margin:22px 0 8px">Eiwit</h2>
        ${tabel(r.eiwit, 'porties')}
        <h2 style="font-size:18px;margin:22px 0 8px">Vet</h2>
        ${tabel(r.vet, 'porties')}
        <h2 style="font-size:18px;margin:22px 0 8px">Op de fiets</h2>
        ${tabel(r.fiets, 'blokken')}
      </div>
    </details>`;
}

function berichtenBlok() {
  const b = D.berichten || [];
  return `
    <div class="blok">
      <h2>Berichten</h2>
      ${b.length ? `<div class="draad">${b.map(x => `
        <div class="bericht ${x.van === 'michel' ? 'michel' : 'ik'}">${veilig(x.tekst)}
          <div class="meta">${x.van === 'michel' ? 'Michel' : 'Jij'}</div></div>`).join('')}</div>` : ''}
      ${D.wachtOpAntwoord
        ? '<div class="gedaan">Je vraag staat open. Michel kijkt ernaar, meestal binnen een werkdag.</div>'
        : `<div class="kaart">
            <div class="veld"><label>Een vraag over je voeding</label>
              <textarea id="vraag" rows="3" placeholder="Bijvoorbeeld: ik heb zaterdag een verjaardag, hoe pak ik dat aan?"></textarea></div>
            <button class="knop leeg" onclick="stuurVraag()">Versturen</button>
            <div class="melding" id="melding_vraag"></div>
          </div>`}
    </div>`;
}

async function stuurVraag() {
  const m = document.getElementById('melding_vraag');
  const tekst = document.getElementById('vraag').value.trim();
  if (tekst.length < 5) { m.textContent = 'Typ je vraag even.'; m.className = 'melding fout'; return; }
  m.textContent = 'Bezig...'; m.className = 'melding';
  const r = await fetch(API + '?actie=vraag', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: token, tekst }) });
  const j = await r.json();
  m.textContent = j.melding || (j.ok ? 'Verstuurd.' : 'Er ging iets mis.');
  m.className = 'melding ' + (j.ok ? 'goed' : 'fout');
  if (j.ok) { const plan = await (await fetch(API + '?actie=plan&t=' + encodeURIComponent(token))).json();
              if (plan.ok) { D = plan; teken(); } }
}

start();
</script>
</body>
</html>
